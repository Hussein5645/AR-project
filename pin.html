<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Model Viewer - WebXR</title>
    
    <script src="aws-config.js"></script>

    <script src="[https://cdn.babylonjs.com/v6.49.0/babylon.js](https://cdn.babylonjs.com/v6.49.0/babylon.js)"></script>
    <script src="[https://cdn.babylonjs.com/v6.49.0/loaders/babylonjs.loaders.min.js](https://cdn.babylonjs.com/v6.49.0/loaders/babylonjs.loaders.min.js)"></script>
    <script src="[https://cdn.babylonjs.com/v6.49.0/gui/babylon.gui.min.js](https://cdn.babylonjs.com/v6.49.0/gui/babylon.gui.min.js)"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

       .spinner {
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body[lang="ar"] { direction: rtl; }
        body[lang="en"] { direction: ltr; }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="spinner"></div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        // Initialize canvas and engine
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        // FIX 2: Explicitly configure Draco Compression to use CDN.
        // This prevents the loader from looking for WASM files locally and failing.
        BABYLON.DracoCompression.Configuration = {
            decoder: {
                wasmUrl: "[https://cdn.babylonjs.com/draco_wasm_wrapper_gltf.js](https://cdn.babylonjs.com/draco_wasm_wrapper_gltf.js)",
                wasmBinaryUrl: "[https://cdn.babylonjs.com/draco_decoder_gltf.wasm](https://cdn.babylonjs.com/draco_decoder_gltf.wasm)",
                fallbackUrl: "[https://cdn.babylonjs.com/draco_decoder_gltf.js](https://cdn.babylonjs.com/draco_decoder_gltf.js)"
            }
        };

        // Check for GUI library load
        if (!BABYLON.GUI) {
            console.error('Babylon GUI library failed to load');
        }

        let createScene = async function () {

            // Create a basic Babylon Scene object
            var scene = new BABYLON.Scene(engine);

            // Create and position a free camera
            var camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 1, -5), scene);
            camera.setTarget(BABYLON.Vector3.Zero());
            camera.attachControl(canvas, true);

            // AR availability check and GUI setup
            const arAvailable = await BABYLON.WebXRSessionManager.IsSessionSupportedAsync('immersive-ar');

            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("FullscreenUI");
            const rectangle = new BABYLON.GUI.Rectangle("rect");
            rectangle.background = "black";
            rectangle.color = "blue";
            rectangle.width = "80%";
            rectangle.height = "50%";

            advancedTexture.addControl(rectangle);
            const nonXRPanel = new BABYLON.GUI.StackPanel();
            rectangle.addControl(nonXRPanel);

            const text1 = new BABYLON.GUI.TextBlock("text1");
            text1.fontFamily = "Helvetica";
            text1.textWrapping = true;
            text1.color = "white";
            text1.fontSize = "14px";
            text1.height = "400px";
            text1.paddingLeft = "10px";
            text1.paddingRight = "10px";
       
            if (!arAvailable) {
                text1.text = "AR is not available on this system. Please use a supported mobile device (Android/iOS) or Meta Quest, and ensure you are on HTTPS.";
                nonXRPanel.addControl(text1);
                // Return scene here so we can still see the 3D model in non-AR mode
            } else {
                text1.text = "WebXR Demo: Hit test and depth sensing.\n \n Enter AR with the button in the lower right. Look at the floor to find a surface, then tap to place the model.";
                nonXRPanel.addControl(text1);
            }

            // Lighting
            var light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            var dirLight = new BABYLON.DirectionalLight('dirLight', new BABYLON.Vector3(0, -1, -0.5), scene);
            dirLight.position = new BABYLON.Vector3(0, 5, -5);

            var shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            function getQueryParam(name) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }

            // Resolve model URL
            let modelUrl = null;
            try {
                modelUrl = sessionStorage.getItem('currentModelUrl');
            } catch (e) {
                console.warn('SessionStorage access blocked:', e.message);
            }

            if (!modelUrl) {
                const modelKey = getQueryParam('model');

                // Safety check for AWS_CONFIG before accessing it
                if (modelKey && typeof window.AWS_CONFIG!== 'undefined' && AWS_CONFIG.bucketName && AWS_CONFIG.region) {
                    modelUrl = `https://${AWS_CONFIG.bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${modelKey}`;
                } else if (modelKey) {
                    modelUrl = modelKey;
                }
            }

            // FIX 3: Fallback to a reliable public CDN URL if no model is found.
            // This prevents local 404 errors when testing.
            if (!modelUrl) {
                console.warn("No model URL found, using default from Babylon Playground");
                modelUrl = "[https://playground.babylonjs.com/scenes/dummy3.babylon](https://playground.babylonjs.com/scenes/dummy3.babylon)";
            }

            // Model Loading
            try {
                const result = await BABYLON.SceneLoader.ImportMeshAsync(
                    "",
                    modelUrl,
                    "", // Empty string ensures it handles full URLs correctly
                    scene
                );
                
                const modelMesh = result.meshes;
                modelMesh.rotationQuaternion = new BABYLON.Quaternion();
                shadowGenerator.addShadowCaster(modelMesh, true);
                
                // Hide initially for AR placement
                modelMesh.isVisible = false;

                // Handle Animations if present (e.g., Robot)
                if (result.skeletons.length > 0) {
                    var skeleton = result.skeletons;
                    skeleton.animationPropertiesOverride = new BABYLON.AnimationPropertiesOverride();
                    skeleton.animationPropertiesOverride.enableBlending = true;
                    skeleton.animationPropertiesOverride.blendingSpeed = 0.05;
                    skeleton.animationPropertiesOverride.loopMode = 1;
                    
                    // Play first animation found as default
                    var ranges = skeleton.getAnimationRanges();
                    if (ranges.length > 0) {
                        scene.beginAnimation(skeleton, ranges.from, ranges.to, true);
                    }
                }

                // WebXR Setup
                if (arAvailable) {
                    const xr = await scene.createDefaultXRExperienceAsync({
                        uiOptions: { sessionMode: 'immersive-ar' },
                        inputOptions: { doNotLoadControllerMeshes: true }
                    });

                    // Hide GUI when entering AR
                    xr.baseExperience.sessionManager.onXRSessionInit.add(() => {
                        rectangle.isVisible = false;
                    });
                    xr.baseExperience.sessionManager.onXRSessionEnded.add(() => {
                        rectangle.isVisible = true;
                    });

                    // Hit Test & Anchors
                    const fm = xr.baseExperience.featuresManager;
                    const xrTest = fm.enableFeature(BABYLON.WebXRHitTest.Name, "latest");
                    const anchors = fm.enableFeature(BABYLON.WebXRAnchorSystem.Name, 'latest');
                    
                    // Marker for hit testing
                    const marker = BABYLON.MeshBuilder.CreateTorus('marker', { diameter: 0.15, thickness: 0.05 });
                    marker.isVisible = false;
                    marker.rotationQuaternion = new BABYLON.Quaternion();

                    let hitTest;

                    xrTest.onHitTestResultObservable.add((results) => {
                        if (results.length) {
                            marker.isVisible = true;
                            hitTest = results;
                            hitTest.transformationMatrix.decompose(undefined, marker.rotationQuaternion, marker.position);
                        } else {
                            marker.isVisible = false;
                            hitTest = undefined;
                        }
                    });

                    if (anchors) {
                        anchors.onAnchorAddedObservable.add(anchor => {
                            // Clone the loaded model at the anchor point
                            const anchorNode = modelMesh.clone("anchorMesh");
                            anchorNode.isVisible = true;
                            anchor.attachedNode = anchorNode;
                            
                            // If skeletal, clone skeleton to animate independently
                            if (result.skeletons.length > 0) {
                                anchorNode.skeleton = result.skeletons.clone('anchorSkeleton');
                                var ranges = anchorNode.skeleton.getAnimationRanges();
                                if (ranges.length > 0) {
                                    scene.beginAnimation(anchorNode.skeleton, ranges.from, ranges.to, true);
                                }
                            }
                            shadowGenerator.addShadowCaster(anchorNode, true);
                        });
                    }

                    scene.onPointerDown = () => {
                        if (hitTest && anchors && xr.baseExperience.state === BABYLON.WebXRState.IN_XR) {
                            anchors.addAnchorPointUsingHitTestResultAsync(hitTest);
                        }
                    }
                } else {
                    // Non-AR fallback: just show the model
                    modelMesh.isVisible = true; 
                    // Reset position for view
                    modelMesh.position = new BABYLON.Vector3(0, 0, 0); 
                }

            } catch (error) {
                console.error("Error loading mesh:", error);
                text1.text += "\n\nError loading model: " + error.message;
            }

            return scene;
        };

        async function initializeApp() {
            try {
                const scene = await createScene();
                document.getElementById('loadingScreen').style.display = 'none';
                
                engine.runRenderLoop(() => {
                    scene.render();
                });

                window.addEventListener('resize', () => {
                    engine.resize();
                });
            } catch (error) {
                console.error('Failed to initialize AR app:', error);
                document.getElementById('loadingScreen').innerHTML = 
                    '<div style="text-align: center; color: #ff6b6b;"><p>Error initializing App</p><p style="font-size: 12px;">' + 
                    error.message + '</p></div>';
            }
        }

        initializeApp();
    </script>
</body>
</html>
