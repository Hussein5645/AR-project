<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Babylon.js WebXR AR: Dummy3</title>

        <style>
            html, body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
            #renderCanvas {
                width: 100%;
                height: 100%;
                touch-action: none;
                outline: none;
            }
            #browser-controls {
                position: fixed;
                left: 10px;
                bottom: 10px;
                background: rgba(0,0,0,0.7);
                color: white;
                padding: 8px;
                border-radius: 6px;
                z-index: 30;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-width: 180px;
            }
            #browser-controls label { font-size: 12px; display: flex; justify-content: space-between; }
            #browser-controls input { width: 70px; }
            #browser-controls .ctrl-header { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
            #browser-controls button { padding: 6px; border-radius:4px; border: none; cursor: pointer; }
        </style>

        <script src="https://cdn.babylonjs.com/babylon.js"></script>
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
        <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.gridMaterial.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
        <script src="aws-config.js"></script>
    </head>

   <body>
    <canvas id="renderCanvas"></canvas>
    <div id="browser-controls">
        <div class="ctrl-header">Browser Placement Controls</div>
        <label>X: <input id="ctrl-x" type="number" step="0.01" value="0"></label>
        <label>Y: <input id="ctrl-y" type="number" step="0.01" value="0"></label>
        <label>Z: <input id="ctrl-z" type="number" step="0.01" value="0"></label>
        <label>RotY: <input id="ctrl-ry" type="number" step="1" value="0"></label>
        <label>Scale: <input id="ctrl-scale" type="number" step="0.01" value="1"></label>
        <button id="place-btn">Place Model</button>
        <button id="remove-btn" style="background:#c0392b;color:#fff;">Rest</button>
    </div>
    
    <script>
        // === INITIALIZATION PHASE ===
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // === SCENE CREATION LOGIC ===
        const createScene = async function () {
            
            // 1. Basic Scene Setup
            const scene = new BABYLON.Scene(engine);
            
            // Non-AR Camera (for testing on PC)
            const camera = new BABYLON.ArcRotateCamera("camera1", Math.PI / 2, Math.PI / 2.5, 5, new BABYLON.Vector3(0, 1, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            // 2. Lighting for AR
            // Ambient light
            const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            // Directional light for shadows
            var dirLight = new BABYLON.DirectionalLight('dirlight', new BABYLON.Vector3(0, -1, -0.5), scene);
            dirLight.position = new BABYLON.Vector3(0, 5, -5);

            // Shadow Generator
            var shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            // 3. UI Setup (Instructions)
            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("FullscreenUI");
            const rectangle = new BABYLON.GUI.Rectangle("rect");
            rectangle.background = "black";
            rectangle.color = "blue";
            rectangle.width = "80%";
            rectangle.height = "20%";
            rectangle.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
            rectangle.top = "20px";
            advancedTexture.addControl(rectangle);

            const text1 = new BABYLON.GUI.TextBlock("text1");
            text1.text = "Initializing AR...";
            text1.color = "white";
            text1.fontSize = "14px";
            text1.textWrapping = true;
            rectangle.addControl(text1);

            // 4. Asset Loading
            // Resolve model URL from query parameter (?model=KEY) using the same S3 method as index.html
            async function resolveModelUrlFromQuery() {
                const params = new URLSearchParams(window.location.search);
                const modelParam = params.get('model');

                if (!modelParam) {
                    return null;
                }

                // Prefer sessionStorage if it already contains the resolved URL for this prefix
                try {
                    const sessPrefix = sessionStorage.getItem('currentModelPrefix');
                    const sessUrl = sessionStorage.getItem('currentModelUrl');
                    if (sessUrl && sessPrefix === modelParam) {
                        return sessUrl;
                    }

                    // Otherwise query S3 like in index.html
                    const s3 = new AWS.S3();
                    const bucketName = AWS_CONFIG.bucketName;

                    const listData = await new Promise((resolve, reject) => {
                        s3.listObjectsV2({ Bucket: bucketName, Prefix: modelParam }, (err, data) => {
                            if (err) return reject(err);
                            resolve(data);
                        });
                    });

                    if (listData && listData.Contents && listData.Contents.length > 0) {
                        const key = listData.Contents[0].Key;
                        const fileUrl = `https://${bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${key}`;
                        // Cache for reuse
                        sessionStorage.setItem('currentModelUrl', fileUrl);
                        sessionStorage.setItem('currentModelKey', key);
                        sessionStorage.setItem('currentModelPrefix', modelParam);
                        return fileUrl;
                    }
                } catch (e) {
                    console.warn('Error resolving model from S3:', e);
                }

                return null;
            }

            console.log("Status: Starting Asset Load");

            let resolvedUrl = await resolveModelUrlFromQuery();
            // Fallback to original dummy model if nothing resolved to avoid breaking the scene
            if (!resolvedUrl) {
                resolvedUrl = "https://playground.babylonjs.com/scenes/dummy3.babylon";
                console.warn('Using fallback model URL (dummy3)');
            }

            // If resolvedUrl is a full URL, split into rootUrl + filename for ImportMeshAsync
            let rootUrl = resolvedUrl;
            let sceneFilename = "";
            const lastSlash = resolvedUrl.lastIndexOf('/');
            if (lastSlash !== -1) {
                rootUrl = resolvedUrl.substring(0, lastSlash + 1);
                sceneFilename = resolvedUrl.substring(lastSlash + 1);
            }

            const result = await BABYLON.SceneLoader.ImportMeshAsync("", rootUrl, sceneFilename, scene);


            // Prepare the mesh (use first as template)
            let originalMesh = result.meshes[0];
            if (originalMesh) {
                originalMesh.rotationQuaternion = new BABYLON.Quaternion();
                originalMesh.isVisible = false; // explicit
            }
            // Model root for relative transform (browser controls apply here)
            const modelRoot = new BABYLON.TransformNode('modelRoot', scene);
            if (originalMesh) {
                originalMesh.parent = modelRoot;
            }

            // Prepare the skeleton and animation
            let skeleton = result.skeletons[0];
            if(skeleton) {
                skeleton.animationPropertiesOverride = new BABYLON.AnimationPropertiesOverride();
                skeleton.animationPropertiesOverride.enableBlending = true;
                skeleton.animationPropertiesOverride.blendingSpeed = 0.05;
                skeleton.animationPropertiesOverride.loopMode = 1;
            }
            
            // 5. Create the Target Marker (The ring on the floor)
            const marker = BABYLON.MeshBuilder.CreateTorus('marker', { diameter: 0.15, thickness: 0.05 });
            marker.isVisible = false;
            marker.rotationQuaternion = new BABYLON.Quaternion();
            const markerMat = new BABYLON.StandardMaterial("markerMat", scene);
            markerMat.emissiveColor = new BABYLON.Color3(1, 0, 0); // Red glow
            marker.material = markerMat;

            // --- Browser-only: origin marker, grid and single-instance placement controls ---
            // Origin point
            const origin = BABYLON.MeshBuilder.CreateSphere('originSphere', { diameter: 0.06 }, scene);
            origin.position = new BABYLON.Vector3(0, 0, 0);
            const originMat = new BABYLON.StandardMaterial('originMat', scene);
            originMat.emissiveColor = new BABYLON.Color3(0, 1, 0);
            origin.material = originMat;
            origin.isPickable = false;

            // X and Z axes lines
            const axisLines = [];
            axisLines.push(BABYLON.MeshBuilder.CreateLines('axisX', { points: [new BABYLON.Vector3(-2,0,0), new BABYLON.Vector3(2,0,0)] }, scene));
            axisLines.push(BABYLON.MeshBuilder.CreateLines('axisZ', { points: [new BABYLON.Vector3(0,0,-2), new BABYLON.Vector3(0,0,2)] }, scene));
            axisLines.forEach(l => { l.color = new BABYLON.Color3(1,0,0); l.isPickable = false; });

            // Infinite-looking grid using GridMaterial on a large ground plane
            let gridGround = BABYLON.MeshBuilder.CreateGround('gridGround', { width: 2000, height: 2000, subdivisions: 1 }, scene);
            let gridMat = new BABYLON.GridMaterial('gridMat', scene);
            gridMat.majorUnitFrequency = 1;       // major lines every 1 unit
            gridMat.minorUnitVisibility = 0.45;   // show minor lines
            gridMat.gridRatio = 0.25;             // units spacing scaling
            gridMat.mainColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            gridMat.lineColor = new BABYLON.Color3(0.6, 0.6, 0.6);
            gridMat.backFaceCulling = false;
            gridGround.material = gridMat;
            gridGround.position.y = 0;
            gridGround.isPickable = false;

            // Gizmo setup for browser mode manipulation
            const gizmoManager = new BABYLON.GizmoManager(scene);
            gizmoManager.clearGizmoOnEmptyPointerEvent = true;
            gizmoManager.attachToMesh(null);
            gizmoManager.positionGizmoEnabled = false;
            gizmoManager.rotationGizmoEnabled = false;
            gizmoManager.scaleGizmoEnabled = false;

            function attachMoveGizmo() {
                gizmoManager.attachToMesh(modelRoot);
                gizmoManager.positionGizmoEnabled = true;
                gizmoManager.rotationGizmoEnabled = false;
                gizmoManager.scaleGizmoEnabled = false;
            }

            function detachGizmo() {
                gizmoManager.attachToMesh(null);
                gizmoManager.positionGizmoEnabled = false;
                gizmoManager.rotationGizmoEnabled = false;
                gizmoManager.scaleGizmoEnabled = false;
            }

            // Adjust grid scale according to camera zoom
            function computeNiceStep(v) {
                const value = Math.max(1e-6, v);
                const exp = Math.floor(Math.log10(value));
                const mant = value / Math.pow(10, exp);
                const niceMant = mant < 1 ? 1 : mant < 2 ? 2 : mant < 5 ? 5 : 10;
                return niceMant * Math.pow(10, exp);
            }
            function updateGridByCameraZoom() {
                const base = Math.max(0.0005, camera.radius * 0.02);
                const step = computeNiceStep(base);
                const clamped = Math.min(10, Math.max(0.0005, step));
                gridMat.gridRatio = clamped;
                gridMat.majorUnitFrequency = 5;
            }
            updateGridByCameraZoom();
            camera.onViewMatrixChangedObservable.add(updateGridByCameraZoom);

            // Browser placement state
            let browserPlaced = false; // use original mesh via modelRoot (no clones)

            const ctrlX = document.getElementById('ctrl-x');
            const ctrlY = document.getElementById('ctrl-y');
            const ctrlZ = document.getElementById('ctrl-z');
            const ctrlRY = document.getElementById('ctrl-ry');
            const ctrlScale = document.getElementById('ctrl-scale');
            const placeBtn = document.getElementById('place-btn');
            const removeBtn = document.getElementById('remove-btn');

            function placeModelInBrowser() {
                const px = parseFloat(ctrlX.value) || 0;
                const py = parseFloat(ctrlY.value) || 0;
                const pz = parseFloat(ctrlZ.value) || 0;
                const ry = (parseFloat(ctrlRY.value) || 0) * (Math.PI/180);
                const s = parseFloat(ctrlScale.value) || 1;


                // Use modelRoot for placement and movement (originalMesh is child)
                if (originalMesh) originalMesh.isVisible = true;
                modelRoot.rotationQuaternion = null;
                modelRoot.position = new BABYLON.Vector3(px, py, pz);
                modelRoot.rotation = new BABYLON.Vector3(0, ry, 0);
                modelRoot.scaling = new BABYLON.Vector3(s, s, s);
                if (skeleton) {
                    try {
                        scene.beginAnimation(skeleton, 0, 100, true);
                    } catch(e) { console.warn('skeleton play failed', e); }
                }
                shadowGenerator.addShadowCaster(originalMesh, true);
                browserPlaced = true;
            }

            placeBtn.addEventListener('click', placeModelInBrowser);

            // Remove button: hide model and reset state
            function removeModelInBrowser() {
                if (!originalMesh) return;
                originalMesh.isVisible = false;
                // optional reset
                originalMesh.position.set(0,0,0);
                originalMesh.rotation.set(0,0,0);
                originalMesh.scaling.set(1,1,1);
                browserPlaced = false;
            }
            removeBtn.addEventListener('click', removeModelInBrowser);

            // Keep numeric controls in sync after gizmo drags
            function updateInputsFromModel() {
                ctrlX.value = (modelRoot.position.x || 0).toFixed(2);
                ctrlY.value = (modelRoot.position.y || 0).toFixed(2);
                ctrlZ.value = (modelRoot.position.z || 0).toFixed(2);
                ctrlRY.value = ((modelRoot.rotation.y || 0) * 180/Math.PI).toFixed(0);
                const s = modelRoot.scaling.x || 1; // uniform
                ctrlScale.value = s.toFixed(2);
            }

            scene.onBeforeRenderObservable.add(() => {
                if (gizmoManager.gizmos && gizmoManager.gizmos.positionGizmo && gizmoManager.gizmos.positionGizmo.attachedMesh) {
                    updateInputsFromModel();
                }
            });

            // Live updates: when placed, update transforms as user types
            function liveUpdateIfPlaced() {
                if (!browserPlaced || !originalMesh) return;
                const px = parseFloat(ctrlX.value) || 0;
                const py = parseFloat(ctrlY.value) || 0;
                const pz = parseFloat(ctrlZ.value) || 0;
                const ry = (parseFloat(ctrlRY.value) || 0) * (Math.PI/180);
                const s = parseFloat(ctrlScale.value) || 1;
                modelRoot.position.set(px, py, pz);
                modelRoot.rotation.set(0, ry, 0);
                modelRoot.scaling.set(s, s, s);
            }
            ['input','change'].forEach(evtName => {
                ctrlX.addEventListener(evtName, liveUpdateIfPlaced);
                ctrlY.addEventListener(evtName, liveUpdateIfPlaced);
                ctrlZ.addEventListener(evtName, liveUpdateIfPlaced);
                ctrlRY.addEventListener(evtName, liveUpdateIfPlaced);
                ctrlScale.addEventListener(evtName, liveUpdateIfPlaced);
            });

            // Hide browser controls when entering XR
            const hideBrowserControls = () => { const el = document.getElementById('browser-controls'); if (el) el.style.display = 'none'; };
            const showBrowserControls = () => { const el = document.getElementById('browser-controls'); if (el) el.style.display = 'flex'; };
            // 6. WebXR Configuration
            // Check if AR is supported
            const arAvailable = await BABYLON.WebXRSessionManager.IsSessionSupportedAsync('immersive-ar');

            if (!arAvailable) {
                text1.text = "AR is not available on this device. Please use a mobile phone with ARCore/ARKit.";
                return scene;
            }

            text1.text = "AR Ready! Click the Goggles button at bottom-right.\nOnce in AR, look at the floor to find a surface, then TAP to place the robot.";

            // Initialize XR with AR options
            const xr = await scene.createDefaultXRExperienceAsync({
                uiOptions: {
                    sessionMode: 'immersive-ar', // KEY: This enables AR instead of VR
                },
                optionalFeatures: true // Enable all optional features like hit-test
            });

            // Prefer grounded reference space for higher real-world stability
            try {
                xr.baseExperience.sessionManager.referenceSpaceType = "local-floor";
            } catch (e) {
                console.warn("Failed to set referenceSpaceType", e);
            }

            // 7. AR Features Manager
            const fm = xr.baseExperience.featuresManager;
            
            // Enable Hit Test (detecting floor)
            const xrTest = fm.enableFeature(BABYLON.WebXRHitTest.Name, "latest");
            
            // Enable Anchors (keeping object in place)
            const anchors = fm.enableFeature(BABYLON.WebXRAnchorSystem.Name, 'latest');

            // Optional: Light estimation for better real-world reference
            let lightEstimation = null;
            try {
                lightEstimation = fm.enableFeature(BABYLON.WebXRLightEstimation.Name, "latest");
            } catch (e) {
                console.warn("Light estimation not available", e);
            }

            // Optional: Plane detection to improve surface stability
            let planeDetector = null;
            try {
                planeDetector = fm.enableFeature(BABYLON.WebXRPlaneDetector.Name, "latest");
            } catch (e) {
                console.warn("Plane detector not available", e);
            }

            // Optional: GIS (Geolocation) layer to validate anchoring to real world
            const GEO_MAX_ACCURACY_M = 5;
            let geoEnabled = false;
            let geoAccuracy = Infinity;
            let geoWatchId = null;

            function startGeoWatch() {
                if (!navigator.geolocation) return;
                geoEnabled = true;
                geoAccuracy = Infinity;
                geoWatchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        geoAccuracy = pos && pos.coords && typeof pos.coords.accuracy === "number"
                            ? pos.coords.accuracy
                            : Infinity;
                    },
                    (err) => {
                        geoEnabled = false;
                        geoAccuracy = Infinity;
                        console.warn("Geolocation error", err);
                    },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                );
            }

            function stopGeoWatch() {
                if (geoWatchId != null && navigator.geolocation) {
                    navigator.geolocation.clearWatch(geoWatchId);
                }
                geoWatchId = null;
                geoAccuracy = Infinity;
            }

            function isGeoReady() {
                return !geoEnabled || geoAccuracy <= GEO_MAX_ACCURACY_M;
            }
            
            // Enable Background Remover (so you see the camera feed)
            // Note: createDefaultXRExperienceAsync usually does this automatically for AR, but we ensure it here
            // const bgRemover = fm.enableFeature(BABYLON.WebXRBackgroundRemover.Name);

            // AR center anchor only
            let centerAnchor = null; // single center anchor per session
            let centerDonutMesh = null;

            function createDonutMesh(color) {
                const donut = BABYLON.MeshBuilder.CreateTorus('arDonut', { diameter: 0.15, thickness: 0.05 }, scene);
                donut.rotationQuaternion = new BABYLON.Quaternion();
                const mat = new BABYLON.StandardMaterial('arDonutMat', scene);
                mat.emissiveColor = color;
                donut.material = mat;
                return donut;
            }

            function removeCenterAnchor() {
                try {
                    if (centerAnchor) {
                        if (anchors && anchors.removeAnchor) anchors.removeAnchor(centerAnchor);
                        else centerAnchor.dispose();
                    }
                } catch (e) {}
                centerAnchor = null;
            }

            // Hide UI when in AR
            xr.baseExperience.sessionManager.onXRSessionInit.add(() => {
                rectangle.isVisible = false;
                hideBrowserControls();
                // Hide origin/grid in AR so canvas starts empty
                origin.setEnabled(false);
                axisLines.forEach(l => l.setEnabled(false));
                if (gridGround) gridGround.setEnabled(false);
                if (originalMesh) { originalMesh.isVisible = false; }
                // Detach modelRoot from any parent at AR start
                modelRoot.parent = null;
                // Detach gizmo in AR
                if (typeof detachGizmo === 'function') detachGizmo();
                // Clear center donut; force re-center on next tap
                if (centerDonutMesh) { try { centerDonutMesh.dispose(); } catch(e){} centerDonutMesh = null; }
                centerAnchor = null;

                // Start GIS tracking for anchoring validation
                startGeoWatch();
            });
            xr.baseExperience.sessionManager.onXRSessionEnded.add(() => {
                rectangle.isVisible = true;
                showBrowserControls();
                // Restore origin/grid after AR session ends
                origin.setEnabled(true);
                axisLines.forEach(l => l.setEnabled(true));
                if (gridGround) gridGround.setEnabled(true);
                // Detach from AR origin
                modelRoot.parent = null;
                // Clear session visuals
                if (centerDonutMesh) { try { centerDonutMesh.dispose(); } catch(e){} centerDonutMesh = null; }
                centerAnchor = null;

                // Stop GIS tracking
                stopGeoWatch();
            });

            // Global state changes: ensure clean tracking state
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    cancelHold();
                    marker.isVisible = false;
                    stableHitCount = 0;
                    stopGeoWatch();
                }
            });

            // 8. Hit Testing Logic
            let hitTest;
            let lastValidHit = null;
            let pendingFinalize = false;

            // Stability filtering
            let lastHitPos = null;
            let stableHitCount = 0;
            const STABLE_THRESHOLD = 0.01; // 1cm
            const STABLE_FRAMES = 5;

            // Smoothing for marker placement
            let smoothedPos = null;
            let smoothedRot = null;
            const SMOOTH_ALPHA = 0.25;

            function composeMatrix(pos, rot) {
                const scl = BABYLON.Vector3.One();
                return BABYLON.Matrix.Compose(scl, rot, pos);
            }

            xrTest.onHitTestResultObservable.add((results) => {
                if (results.length) {
                    marker.isVisible = true;

                    const tmpPos = new BABYLON.Vector3();
                    const tmpRot = new BABYLON.Quaternion();
                    results[0].transformationMatrix.decompose(undefined, tmpRot, tmpPos);

                    // Stability check
                    if (lastHitPos && BABYLON.Vector3.Distance(tmpPos, lastHitPos) < STABLE_THRESHOLD) {
                        stableHitCount++;
                    } else {
                        stableHitCount = 0;
                    }
                    lastHitPos = tmpPos.clone();

                    // Smooth marker pose
                    if (!smoothedPos) {
                        smoothedPos = tmpPos.clone();
                    } else {
                        smoothedPos = BABYLON.Vector3.Lerp(smoothedPos, tmpPos, SMOOTH_ALPHA);
                    }

                    if (!smoothedRot) {
                        smoothedRot = tmpRot.clone();
                    } else {
                        smoothedRot = BABYLON.Quaternion.Slerp(smoothedRot, tmpRot, SMOOTH_ALPHA);
                    }

                    marker.position.copyFrom(smoothedPos);
                    if (marker.rotationQuaternion) {
                        marker.rotationQuaternion.copyFrom(smoothedRot);
                    }

                    // Accept hitTest only when stable to reduce jitter
                    if (stableHitCount >= STABLE_FRAMES) {
                        hitTest = results[0];
                        lastValidHit = results[0];
                    }

                    // If we were waiting for a valid hit to finalize, do it now
                    if (pendingFinalize && anchors && stableHitCount >= STABLE_FRAMES && isGeoReady()) {
                        try {
                            lastHoldMatrix = composeMatrix(smoothedPos, smoothedRot);
                            anchors.addAnchorPointUsingHitTestResultAsync(hitTest || results[0]);
                            triggerHapticFeedback();
                        } catch(e) {}
                        pendingFinalize = false;
                        cancelHold();
                    }
                } else {
                    marker.isVisible = false;
                    hitTest = undefined;
                    stableHitCount = 0;
                }
            });

            // 9. Anchor Logic (Placing the object)
            if (anchors) {
                anchors.onAnchorAddedObservable.add(anchor => {
                    // Preserve model local transform before switching parent
                    const savedPos = modelRoot.position.clone();
                    const savedRot = modelRoot.rotation.clone();
                    const savedScl = modelRoot.scaling.clone();

                    if (!centerDonutMesh) {
                        const donutColor = new BABYLON.Color3(0, 0.8, 1); // cyan center
                        centerDonutMesh = createDonutMesh(donutColor);
                    }

                    // Detach model to preserve local transform while switching anchors
                    modelRoot.parent = null;

                    // Remove old anchor to avoid conflicting updates
                    try {
                        if (centerAnchor && centerAnchor !== anchor) {
                            if (anchors.removeAnchor) anchors.removeAnchor(centerAnchor); else centerAnchor.dispose();
                        }
                    } catch(e){}

                    // Reassign center to new anchor without recreating the donut
                    centerAnchor = anchor;
                    anchor.attachedNode = centerDonutMesh;

                    // Apply snapped hold pose immediately to the donut
                    if (lastHoldMatrix && centerDonutMesh.rotationQuaternion) {
                        lastHoldMatrix.decompose(undefined, centerDonutMesh.rotationQuaternion, centerDonutMesh.position);
                        lastHoldMatrix = null;
                    }

                    // Re-parent based on toggle
                    modelRoot.parent = centerDonutMesh;
                    modelRoot.position.copyFrom(savedPos);
                    modelRoot.rotation.copyFrom(savedRot);
                    modelRoot.scaling.copyFrom(savedScl);
                    if (originalMesh) originalMesh.isVisible = true;
                    if (skeleton) { try { scene.beginAnimation(skeleton, 0, 100, true); } catch(e) {} }
                    shadowGenerator.addShadowCaster(originalMesh, true);
                });
            }

            // 10. Input Handling (Hold-to-recenter in AR / Click to select in browser)
            let holdActive = false;
            let holdStart = 0;
            const HOLD_THRESHOLD_MS = 800;
            let lastHoldMatrix = null;

            function triggerHapticFeedback() {
                try {
                    if (navigator && typeof navigator.vibrate === 'function') {
                        navigator.vibrate(40);
                    }
                } catch (e) {}
            }

            function startHoldIfAR() {
                if (!hitTest || !anchors || xr.baseExperience.state !== BABYLON.WebXRState.IN_XR) return false;
                holdActive = true;
                holdStart = performance.now();
                return true;
            }

            function cancelHold() {
                holdActive = false;
                // reset visual indicators
                if (markerMat) markerMat.emissiveColor = new BABYLON.Color3(1, 0, 0);
                if (centerDonutMesh && centerDonutMesh.material && centerDonutMesh.material.emissiveColor) {
                    centerDonutMesh.material.emissiveColor = new BABYLON.Color3(0, 0.8, 1);
                }
            }

            async function finalizeHoldIfReady() {
                if (!anchors) { cancelHold(); return; }
                if (!hitTest || stableHitCount < STABLE_FRAMES) {
                    pendingFinalize = true;
                    return;
                }
                if (!isGeoReady()) {
                    pendingFinalize = true;
                    return;
                }
                // create/assign anchor at current hit test
                try {
                    // snapshot matrix to ensure consistent pose application in anchorAdded
                    if (smoothedPos && smoothedRot) {
                        lastHoldMatrix = composeMatrix(smoothedPos, smoothedRot);
                    } else {
                        lastHoldMatrix = hitTest.transformationMatrix.clone();
                    }
                    // Remove old center before creating new one
                    removeCenterAnchor();
                    // Immediate visual update to ensure center switches every time
                    if (centerDonutMesh && centerDonutMesh.rotationQuaternion) {
                        lastHoldMatrix.decompose(undefined, centerDonutMesh.rotationQuaternion, centerDonutMesh.position);
                    }
                    // Ensure model is parented to donut instantly even before anchor resolves
                    if (centerDonutMesh) {
                        const savedPos = modelRoot.position.clone();
                        const savedRot = modelRoot.rotation.clone();
                        const savedScl = modelRoot.scaling.clone();
                        modelRoot.parent = centerDonutMesh;
                        modelRoot.position.copyFrom(savedPos);
                        modelRoot.rotation.copyFrom(savedRot);
                        modelRoot.scaling.copyFrom(savedScl);
                        if (originalMesh) originalMesh.isVisible = true;
                    }
                    await anchors.addAnchorPointUsingHitTestResultAsync(hitTest);
                } catch(e) {}
                // haptic feedback on completion
                triggerHapticFeedback();
                cancelHold();
            }

            function updateHoldIndicator() {
                if (!holdActive) return;
                const now = performance.now();
                const ratio = Math.min(1, (now - holdStart) / HOLD_THRESHOLD_MS);
                // Always use marker color at target location for progress
                const start = new BABYLON.Color3(1, 0.6, 0); // orange
                const end = new BABYLON.Color3(0, 0.8, 1);   // cyan
                markerMat.emissiveColor = BABYLON.Color3.Lerp(start, end, ratio);
                // Optional subtle scale pulse
                const pulse = 0.9 + 0.2 * ratio;
                marker.scaling.set(pulse, pulse, pulse);
                if (ratio >= 1) {
                    finalizeHoldIfReady();
                }
            }

            scene.onPointerDown = (evt, pickInfo) => {
                // AR: start hold-to-recenter
                if (startHoldIfAR()) return;
                // Browser click: attach gizmo when clicking the model
                if (xr.baseExperience.state !== BABYLON.WebXRState.IN_XR && originalMesh && originalMesh.isVisible) {
                    const pick = scene.pick(scene.pointerX, scene.pointerY);
                    if (pick.hit && pick.pickedMesh) {
                        const m = pick.pickedMesh;
                        const isOnModel = (m === originalMesh) || (m.isDescendantOf && m.isDescendantOf(originalMesh));
                        if (isOnModel) {
                            attachMoveGizmo();
                        } else {
                            detachGizmo();
                        }
                    } else {
                        detachGizmo();
                    }
                }
            };

            scene.onPointerUp = (evt, pickInfo) => {
                // Cancel hold if not completed
                if (holdActive) cancelHold();
            };

            scene.onBeforeRenderObservable.add(() => {
                updateHoldIndicator();
            });

            return scene;
        };

        // === EXECUTION PHASE ===
        createScene().then((scene) => {
            engine.runRenderLoop(function () {
                if (scene) {
                    scene.render();
                }
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
   </body>
