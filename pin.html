<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>AR Model Viewer - AWS</title>
    
    <!-- AR.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@r126/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r126/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/three.js/ar.js"></script>
    
    <!-- AWS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
    <script src="aws-config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .ui-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 300px;
        }

        .title {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #222;
            color: #fff;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #0099ff;
            background: #1a1a1a;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #0099ff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0077cc;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .model-list {
            color: #aaa;
            font-size: 12px;
            margin-top: 10px;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        .model-item {
            background: #1a1a1a;
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .model-item:hover {
            background: #2a2a2a;
        }

        .status {
            color: #0f0;
            font-size: 12px;
            margin-top: 10px;
            padding: 8px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 3px;
            display: none;
        }

        .status.active {
            display: block;
        }

        .error {
            color: #f00;
            font-size: 12px;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 3px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .controls-hint {
            color: #888;
            font-size: 11px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
            line-height: 1.6;
        }

        .loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-container">
        <div class="title">🌍 AR Model Loader</div>
        
        <div class="input-group">
            <label>Model URL (S3 or Full URL)</label>
            <input 
                type="text" 
                id="modelUrl" 
                placeholder="e.g., model.gltf or s3://bucket/model.gltf"
            >
        </div>

        <div class="button-group">
            <button id="loadBtn">📥 Load Model</button>
            <button id="clearBtn">🗑️ Clear</button>
        </div>

        <div class="model-list" id="modelList">
            <div style="color: #0099ff; font-weight: bold; margin-bottom: 8px;">📦 Models in S3</div>
            <div id="modelItems" style="max-height: 150px; overflow-y: auto;"></div>
        </div>

        <div class="status" id="status"></div>
        <div class="error" id="error"></div>

        <div class="controls-hint">
            💡 <strong>Controls:</strong><br>
            ⬆️ Pinch to zoom<br>
            🔄 Rotate model<br>
            ➡️ Drag to move
        </div>
    </div>

    <script>
        // Global variables
        let scene, camera, renderer, arToolkitSource, arToolkitContext;
        let loadedModel = null;
        const s3 = new AWS.S3({
            accessKeyId: AWS_CONFIG.accessKeyId,
            secretAccessKey: AWS_CONFIG.secretAccessKey,
            region: AWS_CONFIG.region
        });

        // Get URL query parameter
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Initialize Three.js AR scene
        function initAR() {
            // Setup canvas and renderer
            const canvas = document.getElementById('canvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Setup scene
            scene = new THREE.Scene();

            // Setup camera
            camera = new THREE.Camera();
            scene.add(camera);

            // Setup AR.js
            arToolkitSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam',
                sourceWidth: 1280,
                sourceHeight: 960
            });

            arToolkitSource.init(() => onARSourceReady(arToolkitSource));

            // Setup AR context
            const parameters = {
                detectionMode: 'color',
                matrixCodeType: '3x3',
                canvasWidth: window.innerWidth,
                canvasHeight: window.innerHeight
            };

            arToolkitContext = new THREEx.ArToolkitContext(parameters);
            arToolkitContext.init(() => {
                camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
            });

            // Setup lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 5);
            light.castShadow = true;
            scene.add(light);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            // Setup ground plane for model placement
            const planeGeometry = new THREE.PlaneGeometry(100, 100);
            const planeMaterial = new THREE.MeshStandardMaterial({
                color: 0x888888,
                transparent: true,
                opacity: 0.1
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.receiveShadow = true;
            scene.add(plane);

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Start render loop
            render();
        }

        function onARSourceReady(arToolkitSource) {
            arToolkitSource.domElement.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, false);
        }

        function render() {
            requestAnimationFrame(render);

            if (arToolkitSource && arToolkitSource.ready !== false) {
                arToolkitContext.update(arToolkitSource.domElement);
            }

            // Rotate model if loaded
            if (loadedModel) {
                loadedModel.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            arToolkitSource.onResizeElement();
            arToolkitSource.copyElementSizeTo(renderer.domElement);
            if (arToolkitContext && arToolkitContext.arController) {
                arToolkitContext.arController.orientation = window.orientation;
                arToolkitContext.arController.options.trackingBackend = 'artoolkit';
            }
        }

        // Load model from S3 or URL
        async function loadModel() {
            const urlInput = document.getElementById('modelUrl').value.trim();
            
            if (!urlInput) {
                showError('Please enter a model URL');
                return;
            }

            showStatus('Loading model...');
            
            try {
                let modelUrl = urlInput;

                // If it's an S3 path, convert to signed URL
                if (urlInput.startsWith('s3://')) {
                    const s3Path = urlInput.replace('s3://', '').split('/');
                    const key = s3Path.slice(1).join('/');
                    modelUrl = s3.getSignedUrl('getObject', {
                        Bucket: AWS_CONFIG.bucketName,
                        Key: key,
                        Expires: 3600
                    });
                } else if (!urlInput.startsWith('http')) {
                    // Assume it's a key in the bucket
                    modelUrl = s3.getSignedUrl('getObject', {
                        Bucket: AWS_CONFIG.bucketName,
                        Key: urlInput,
                        Expires: 3600
                    });
                }

                // Load the model using GLTFLoader
                const loader = new THREE.GLTFLoader();
                loader.load(
                    modelUrl,
                    (gltf) => {
                        if (loadedModel) {
                            scene.remove(loadedModel);
                        }

                        loadedModel = gltf.scene;
                        loadedModel.scale.set(0.5, 0.5, 0.5);
                        loadedModel.position.y = 0;
                        loadedModel.castShadow = true;
                        loadedModel.receiveShadow = true;

                        // Process all meshes in the model
                        loadedModel.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });

                        scene.add(loadedModel);
                        showStatus('✅ Model loaded successfully!');
                        hideError();
                    },
                    (progress) => {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        showStatus(`Loading... ${percent}%`);
                    },
                    (error) => {
                        showError(`Failed to load model: ${error.message}`);
                    }
                );
            } catch (error) {
                showError(`Error: ${error.message}`);
            }
        }

        // Fetch and list models from S3
        async function listS3Models() {
            try {
                showStatus('Fetching models from S3...');
                const params = {
                    Bucket: AWS_CONFIG.bucketName,
                    Prefix: ''
                };

                s3.listObjects(params, (err, data) => {
                    if (err) {
                        showError(`Failed to list S3 objects: ${err.message}`);
                        return;
                    }

                    const modelItems = document.getElementById('modelItems');
                    modelItems.innerHTML = '';

                    if (data.Contents && data.Contents.length > 0) {
                        data.Contents.forEach((item) => {
                            if (item.Key.match(/\.(gltf|glb|fbx|obj)$/i)) {
                                const div = document.createElement('div');
                                div.className = 'model-item';
                                div.textContent = item.Key;
                                div.onclick = () => {
                                    document.getElementById('modelUrl').value = item.Key;
                                    loadModel();
                                };
                                modelItems.appendChild(div);
                            }
                        });
                        hideError();
                    } else {
                        showError('No 3D models found in S3');
                    }
                });
            } catch (error) {
                showError(`Error listing models: ${error.message}`);
            }
        }

        // UI Helper functions
        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.classList.add('active');
        }

        function hideStatus() {
            const status = document.getElementById('status');
            status.classList.remove('active');
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.classList.add('active');
        }

        function hideError() {
            const error = document.getElementById('error');
            error.classList.remove('active');
        }

        // Event listeners
        document.getElementById('loadBtn').addEventListener('click', loadModel);
        document.getElementById('clearBtn').addEventListener('click', () => {
            if (loadedModel) {
                scene.remove(loadedModel);
                loadedModel = null;
                hideStatus();
                hideError();
                document.getElementById('modelUrl').value = '';
            }
        });

        // Initialize AR on page load
        document.addEventListener('DOMContentLoaded', () => {
            initAR();
            listS3Models();

            // Check for model parameter in URL
            const modelParam = getQueryParam('model');
            if (modelParam) {
                document.getElementById('modelUrl').value = modelParam;
                // Delay to ensure AR is fully initialized
                setTimeout(() => {
                    loadModel();
                }, 1000);
            }
        });
    </script>
</body>
</html>
