<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Location Based AR Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
    <script src="aws-config.js"></script>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        #camera-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #info-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            z-index: 100;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: #fff;
            font-size: 18px;
            flex-direction: column;
        }

        #load-model-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            z-index: 100;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            transition: background 0.3s;
        }

        #load-model-button:hover {
            background: #218838;
        }

        #load-model-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #distance-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 100;
            font-size: 16px;
            min-width: 250px;
            text-align: center;
        }

        #location-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 100;
            font-size: 12px;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background-color: #4CAF50;
        }

        .status-dot.inactive {
            background-color: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #controls {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            z-index: 150;
            text-align: center;
            display: none;
        }

        #controls.show {
            display: block;
        }

        .button {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Loading 3D model...</div>
    </div>


    <!-- Info Panel -->
    <div id="info-panel">
        <h3>Location AR</h3>
        <p id="model-name">Loading model...</p>
        <p id="coordinates">Coordinates: --</p>
    </div>

    <!-- Distance Info -->
    <div id="distance-info">
        <p>Distance to Model: <span id="distance-value">--</span></p>
        <p id="bearing-info">Direction: --</p>
    </div>

    <!-- Location Status -->
    <div id="location-status">
        <span class="status-dot inactive" id="status-dot"></span>
        <span id="status-text">Initializing GPS...</span>
    </div>

    <!-- Controls Panel -->
    <div id="controls">
        <h3>AR Controls</h3>
        <button class="button" onclick="resetView()">Reset View</button>
        <button class="button" onclick="toggleInfo()">Toggle Info</button>
        <button class="button" onclick="goBack()">Back</button>
    </div>
    <!-- Load Model Button -->
    <button id="load-model-button" onclick="startLoadingModel()">Load Model</button>

    <!-- Camera Canvas -->
    <canvas id="camera-canvas"></canvas>

    <!-- A-Frame Scene -->
    <a-scene 
        id="scene"
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true; precision: medium; webglVersion: 1;"
        embedded
    >
        <!-- Camera -->
        <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

        <!-- 3D Model Entity -->
        <a-entity 
            id="model-entity"
            position="0 0 -2"
            rotation="0 0 0"
            scale="1 1 1"
        >
            <!-- Model will be loaded here -->
        </a-entity>

        <!-- Light sources for better visibility -->
        <a-light type="ambient" intensity="2" color="#fff"></a-light>
        <a-light type="directional" intensity="1.5" color="#fff" position="5 10 7"></a-light>

        <!-- Ground plane for reference -->
        <a-plane position="0 -1 -2" rotation="-90 0 0" width="4" height="4" color="#444" opacity="0.5"></a-plane>

        <!-- Sky for AR background -->
        <a-sky color="#87CEEB"></a-sky>
    </a-scene>

    <!-- Scripts -->
    <script>
        // Camera setup
        const canvas = document.getElementById('camera-canvas');
        const ctx = canvas.getContext('2d');
        let videoStream = null;

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Initialize camera
        async function initializeCamera() {
            try {
                console.log('Requesting camera access...');
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                console.log('Camera access granted');
                
                const video = document.createElement('video');
                video.srcObject = videoStream;
                video.play();
                
                // Draw camera feed to canvas
                function drawCamera() {
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    }
                    requestAnimationFrame(drawCamera);
                }
                drawCamera();
                
                loadingText.textContent = 'Camera Ready';
                
            } catch (error) {
                console.error('Camera error:', error);
                loadingText.textContent = 'Camera Error: ' + error.message;
                alert('Please allow camera access');
            }
        }

        // Initialize variables
        const AWS_CONFIG_DATA = AWS_CONFIG;
        const s3 = new AWS.S3();
        const bucketName = AWS_CONFIG_DATA.bucketName;
        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');
        const loadModelButton = document.getElementById('load-model-button');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const infoPanel = document.getElementById('info-panel');
        const distanceValue = document.getElementById('distance-value');
        const bearingInfo = document.getElementById('bearing-info');
        const modelNameEl = document.getElementById('model-name');
        const coordinatesEl = document.getElementById('coordinates');
        const scene = document.getElementById('scene');

        let userLocation = null;
        let modelLocation = { latitude: 0, longitude: 0 };
        let currentModelUrl = null;
        let currentModelKey = null;
        let watchId = null;
        let modelLoaded = false;

        // Get query parameters
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Initialize GPS tracking
        function initGPS() {
            statusText.textContent = 'Initializing GPS...';
            statusDot.classList.remove('active');
            statusDot.classList.add('inactive');

            if ('geolocation' in navigator) {
                // Get initial position
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            altitude: position.coords.altitude || 0,
                            accuracy: position.coords.accuracy
                        };
                        
                        console.log('User location:', userLocation);
                        statusText.textContent = 'GPS Connected';
                        statusDot.classList.add('active');
                        statusDot.classList.remove('inactive');
                        
                        // Show load model button
                        loadModelButton.style.display = 'block';

                        // Watch position for continuous updates
                        if (watchId === null) {
                            watchId = navigator.geolocation.watchPosition(
                                (position) => {
                                    userLocation = {
                                        latitude: position.coords.latitude,
                                        longitude: position.coords.longitude,
                                        altitude: position.coords.altitude || 0,
                                        accuracy: position.coords.accuracy
                                    };
                                    updateDistanceAndBearing();
                                    updateCoordinates();
                                },
                                (error) => {
                                    console.error('GPS error:', error);
                                    statusText.textContent = 'GPS Error: ' + error.message;
                                    statusDot.classList.remove('active');
                                    statusDot.classList.add('inactive');
                                },
                                { 
                                    enableHighAccuracy: true,
                                    maximumAge: 0,
                                    timeout: 27000
                                }
                            );
                        }
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        statusText.textContent = 'GPS Error: ' + error.message;
                        statusDot.classList.remove('active');
                        statusDot.classList.add('inactive');
                        alert('Please enable location services and refresh the page.');
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 27000
                    }
                );
            } else {
                alert('Geolocation is not supported by this browser.');
                statusText.textContent = 'GPS Not Supported';
                statusDot.classList.remove('active');
                statusDot.classList.add('inactive');
            }
        }

        // Set model location (offset from user)
        function setModelLocation() {
            // Model is now positioned at a fixed distance from camera (0 0 -3)
            // This provides better visibility in AR.js
            if (!userLocation) return;
            updateDistanceAndBearing();
        }

        // Calculate distance between two coordinates
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Earth's radius in meters
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = R * c;
            return distance;
        }

        // Calculate bearing
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            const bearing = Math.atan2(y, x) * 180 / Math.PI;
            return (bearing + 360) % 360;
        }

        // Update distance and bearing display
        function updateDistanceAndBearing() {
            if (!userLocation) return;

            const distance = calculateDistance(
                userLocation.latitude,
                userLocation.longitude,
                modelLocation.latitude,
                modelLocation.longitude
            );

            const bearing = calculateBearing(
                userLocation.latitude,
                userLocation.longitude,
                modelLocation.latitude,
                modelLocation.longitude
            );

            distanceValue.textContent = distance.toFixed(1) + ' m';
            bearingInfo.textContent = `Direction: ${bearing.toFixed(0)}° (from North)`;
        }

        // Update coordinates display
        function updateCoordinates() {
            if (!userLocation) return;
            coordinatesEl.textContent = `Coordinates: ${userLocation.latitude.toFixed(6)}, ${userLocation.longitude.toFixed(6)}`;
        }

        // Load model from AWS
        function loadModelFromAWS(prefix) {
            loadingScreen.style.display = 'flex';
            loadingText.textContent = 'Fetching model from AWS...';
            loadModelButton.disabled = true;

            s3.listObjectsV2({ Bucket: bucketName, Prefix: prefix }, (err, data) => {
                if (err) {
                    console.error('Error fetching bucket contents:', err);
                    loadingText.textContent = 'Error: Could not fetch model';
                    loadModelButton.disabled = false;
                    return;
                }

                if (data && data.Contents && data.Contents.length > 0) {
                    const key = data.Contents[0].Key;
                    currentModelKey = key;

                    const fileUrl = `https://${bucketName}.s3.${AWS_CONFIG_DATA.region}.amazonaws.com/${key}`;
                    currentModelUrl = fileUrl;

                    modelNameEl.textContent = `Model: ${key.split('/').pop()}`;

                    // Determine file type
                    const fileExtension = key.split('.').pop().toLowerCase();

                    if (fileExtension === 'gltf' || fileExtension === 'glb') {
                        loadGLTFModel(fileUrl);
                    } else {
                        loadingText.textContent = 'Error: Unsupported file format (Only GLB/GLTF supported)';
                        loadModelButton.disabled = false;
                        console.error('Unsupported file format:', fileExtension);
                    }
                } else {
                    loadingText.textContent = 'Error: Model not found';
                    loadModelButton.disabled = false;
                    console.error('No model found with prefix:', prefix);
                }
            });
        }

        // Load GLTF/GLB model
        function loadGLTFModel(url) {
            loadingText.textContent = 'Loading 3D model...';

            const modelEntity = document.getElementById('model-entity');
            
            // Remove existing model if any
            const existingModel = modelEntity.querySelector('a-gltf-model');
            if (existingModel) {
                existingModel.remove();
            }

            // Create and append GLTF model
            const gltfModel = document.createElement('a-gltf-model');
            gltfModel.setAttribute('src', url);
            gltfModel.setAttribute('scale', '1.5 1.5 1.5');
            gltfModel.setAttribute('rotation', '0 0 0');
            gltfModel.setAttribute('animation', 'property: rotation; from: 0 0 0; to: 0 360 0; dur: 4000; loop: true');
            
            gltfModel.addEventListener('loaded', () => {
                console.log('Model loaded successfully');
                
                // Get the model's bounding box to auto-center
                const modelObject3D = gltfModel.getObject3D('mesh');
                if (modelObject3D) {
                    // Center the model
                    const box = new THREE.Box3().setFromObject(modelObject3D);
                    const center = box.getCenter(new THREE.Vector3());
                    modelObject3D.position.sub(center);
                    
                    console.log('Model size:', box.getSize(new THREE.Vector3()));
                }
                
                loadingScreen.style.display = 'none';
                loadModelButton.style.display = 'none';
                modelLoaded = true;
                
                // Update UI
                updateDistanceAndBearing();
            });

            gltfModel.addEventListener('error', (event) => {
                console.error('Error loading model:', event);
                loadingText.textContent = 'Error: Could not load 3D model. Check console.';
                loadModelButton.disabled = false;
                loadModelButton.style.display = 'block';
            });

            modelEntity.appendChild(gltfModel);
        }

        // Control functions
        function resetView() {
            // Reset camera and model
            setModelLocation();
            console.log('View reset');
        }

        function toggleInfo() {
            infoPanel.style.display = infoPanel.style.display === 'none' ? 'block' : 'none';
        }

        function goBack() {
            window.history.back();
        }

        // Start loading model
        function startLoadingModel() {
            const modelKey = getQueryParam('model');
            if (modelKey) {
                loadModelFromAWS(modelKey);
            } else {
                alert('No model key specified. Use ?model=KEY');
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, initializing camera...');
            
            // Initialize camera immediately
            initializeCamera();
            
            // Initialize GPS
            initGPS();

            // Don't auto-load model - wait for button click
            const modelKey = getQueryParam('model');
            if (!modelKey) {
                loadingText.textContent = 'Ready - Camera active';
            }

            // Update UI periodically
            setInterval(() => {
                updateCoordinates();
            }, 1000);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
