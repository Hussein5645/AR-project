<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pin AR Model (WebXR)</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
  <script src="aws-config.js"></script>
  <style>
    body[lang="ar"] { direction: rtl; }
    body[lang="en"] { direction: ltr; }
    body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: #fff; overflow: hidden; }
    #ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); padding: 12px; border-radius: 8px; width: calc(100% - 20px); max-width: 520px; z-index: 10; }
    #ui h2 { margin: 0 0 8px 0; font-size: 18px; }
    #ui .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #ui input[type="text"], #ui input[type="range"] { flex: 1; padding: 8px; border: none; border-radius: 6px; background: #2a2a2a; color: #fff; }
    #ui input[type="text"]::placeholder { color: #bbb; }
    #ui button { padding: 10px 14px; border: none; border-radius: 6px; background: #007bff; color: #fff; font-weight: bold; cursor: pointer; }
    #ui button.secondary { background: #444; }
    #ui button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { font-size: 12px; color: #bbb; margin-top: 4px; }
    #lang-toggle { position: fixed; top: 10px; right: 10px; z-index: 11; padding: 8px 12px; border-radius: 6px; background: #444; color: #fff; cursor: pointer; }
    canvas.xr { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; color: #fff; font-size: 1.5em; z-index: 20; transition: opacity 0.5s ease; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #ar-overlay { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px; display: none; z-index: 25; min-width: 280px; text-align: center; }
    #ar-overlay button { width: 100%; margin: 5px 0; padding: 12px; border: none; border-radius: 6px; background: #28a745; color: #fff; font-weight: bold; cursor: pointer; }
    #ar-overlay button:hover { background: #218838; }
    #ar-overlay p { margin: 5px 0; font-size: 14px; color: #bbb; }
    
    #xr-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
    #xr-overlay > * { pointer-events: auto; }
    #xr-controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 12px; display: none; min-width: 320px; }
    body[lang="ar"] #xr-controls { direction: rtl; }
    body[lang="en"] #xr-controls { direction: ltr; }
    #xr-controls h3 { margin: 0 0 15px 0; font-size: 16px; color: #fff; text-align: center; }
    #xr-controls .control-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    #xr-controls label { color: #fff; font-size: 14px; min-width: 60px; }
    #xr-controls input[type="range"] { flex: 1; }
    #xr-controls .value-display { color: #0f0; font-weight: bold; min-width: 60px; text-align: center; }
    #xr-controls button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 14px; }
    #xr-controls .btn-primary { background: #28a745; color: #fff; }
    #xr-controls .btn-primary:hover { background: #218838; }
    #xr-controls .btn-secondary { background: #6c757d; color: #fff; }
    #xr-controls .btn-secondary:hover { background: #5a6268; }
    #xr-controls .status-text { color: #ffc107; font-size: 13px; text-align: center; margin: 10px 0; }
    #xr-surface-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffaa; font-size: 18px; text-align: center; display: none; pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
    #xr-surface-indicator .icon { font-size: 48px; margin-bottom: 10px; }
  </style>
</head>
<body lang="ar">
  <div id="loading-screen" class="hidden">جار التحميل...</div>
  <button id="lang-toggle">English</button>

  <div id="ar-overlay">
    <p id="ar-overlay-text">النموذج مثبت! احفظ الموقع؟</p>
    <button id="save-pin-aws">حفظ بيانات التثبيت في AWS</button>
  </div>

  <div id="xr-overlay">
    <div id="xr-surface-indicator">
      <div class="icon">⊕</div>
      <div id="surface-text">ابحث عن سطح واضغط للتثبيت</div>
    </div>
    
    <div id="xr-controls">
      <h3 id="xr-title">إعدادات النموذج</h3>
      
      <div class="control-row">
        <label id="xr-scale-label">الحجم:</label>
        <input id="xr-scale" type="range" min="0.1" max="5" step="0.01" value="1" />
        <span id="xr-scale-val" class="value-display">1.00×</span>
      </div>
      
      <div class="control-row">
        <label id="xr-rotate-label">الدوران:</label>
        <input id="xr-rotate" type="range" min="0" max="360" step="1" value="0" />
        <span id="xr-rotate-val" class="value-display">0°</span>
      </div>
      
      <p id="xr-status" class="status-text">النموذج مثبت - اضبط الإعدادات</p>
      
      <button id="xr-save-aws" class="btn-primary">حفظ في AWS</button>
      <button id="xr-reset" class="btn-secondary">إعادة التثبيت</button>
    </div>
  </div>

  <div id="ui">
    <h2 id="title">تثبيت النموذج في الواقع المعزز</h2>

    <div class="row">
      <button id="start-ar" disabled>بدء AR (WebXR)</button>
    </div>

    <div id="status">جار تحميل النموذج...</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // Language content
    const textContent = {
      ar: {
        title: 'تثبيت النموذج في الواقع المعزز',
        startAR: 'بدء AR (WebXR)',
        statusReady: 'جاهز. يتطلب Chrome على Android لدعم WebXR.',
        statusLoaded: 'تم تحميل النموذج. اضغط بدء AR.',
        statusLoading: 'جار تحميل النموذج...',
        statusError: 'خطأ: يجب تحميل نموذج من الصفحة الرئيسية أولاً',
        loading: 'جار التحميل...',
        arOverlay: 'النموذج مثبت! احفظ الموقع؟',
        savePinAWS: 'حفظ بيانات التثبيت في AWS',
        toggleLang: 'English',
        xrTitle: 'إعدادات النموذج',
        xrScaleLabel: 'الحجم:',
        xrRotateLabel: 'الدوران:',
        xrStatus: 'النموذج مثبت - اضبط الإعدادات',
        xrSaveAWS: 'حفظ في AWS',
        xrReset: 'إعادة التثبيت',
        surfaceText: 'ابحث عن سطح واضغط للتثبيت'
      },
      en: {
        title: 'Pin the Model in AR',
        startAR: 'Start AR (WebXR)',
        statusReady: 'Ready. Requires Chrome on Android with WebXR.',
        statusLoaded: 'Model loaded. Tap Start AR.',
        statusLoading: 'Loading model...',
        statusError: 'Error: Please load a model from home page first',
        loading: 'Loading content...',
        arOverlay: 'Model pinned! Save location?',
        savePinAWS: 'Save Pin Data to AWS',
        toggleLang: 'Arabic',
        xrTitle: 'Model Settings',
        xrScaleLabel: 'Scale:',
        xrRotateLabel: 'Rotate:',
        xrStatus: 'Model placed - adjust settings',
        xrSaveAWS: 'Save to AWS',
        xrReset: 'Reposition',
        surfaceText: 'Find a surface and tap to place'
      }
    };

    function setLang(lang) {
      document.documentElement.lang = lang;
      document.body.setAttribute('lang', lang);
      const t = textContent[lang];
      title.textContent = t.title;
      startARBtn.textContent = t.startAR;
      document.getElementById('loading-screen').textContent = t.loading;
      document.getElementById('ar-overlay-text').textContent = t.arOverlay;
      document.getElementById('save-pin-aws').textContent = t.savePinAWS;
      langToggle.textContent = t.toggleLang;
      document.getElementById('xr-title').textContent = t.xrTitle;
      document.getElementById('xr-scale-label').textContent = t.xrScaleLabel;
      document.getElementById('xr-rotate-label').textContent = t.xrRotateLabel;
      document.getElementById('xr-status').textContent = t.xrStatus;
      document.getElementById('xr-save-aws').textContent = t.xrSaveAWS;
      document.getElementById('xr-reset').textContent = t.xrReset;
      document.getElementById('surface-text').textContent = t.surfaceText;
    }

    const langToggle = document.getElementById('lang-toggle');
    const title = document.getElementById('title');
    const startARBtn = document.getElementById('start-ar');
    const status = document.getElementById('status');
    const loadingScreen = document.getElementById('loading-screen');
    
    const xrOverlay = document.getElementById('xr-overlay');
    const xrControls = document.getElementById('xr-controls');
    const xrSurfaceIndicator = document.getElementById('xr-surface-indicator');
    const xrScaleInput = document.getElementById('xr-scale');
    const xrScaleVal = document.getElementById('xr-scale-val');
    const xrRotateInput = document.getElementById('xr-rotate');
    const xrRotateVal = document.getElementById('xr-rotate-val');
    const xrSaveAWSBtn = document.getElementById('xr-save-aws');
    const xrResetBtn = document.getElementById('xr-reset');

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let loadedBytes = 0;

    // Toggle language
    langToggle.addEventListener('click', () => {
      const newLang = (document.documentElement.lang === 'ar') ? 'en' : 'ar';
      setLang(newLang);
    });

    // Show loading screen with progress
    function showLoadingScreen(show, totalBytes = 0) {
      loadingScreen.classList.toggle('hidden', !show);
      
      if (show && totalBytes > 0) {
        const updateProgress = () => {
          const currentLang = document.documentElement.lang;
          const baseText = textContent[currentLang].loading;
          loadingScreen.innerText = `${baseText} ${(loadedBytes / (1024 * 1024)).toFixed(2)} MB / ${(totalBytes / (1024 * 1024)).toFixed(2)} MB`;
          
          if (!loadingScreen.classList.contains('hidden')) {
            requestAnimationFrame(updateProgress);
          }
        };
        updateProgress();
      } else if (show) {
        loadingScreen.innerText = textContent[document.documentElement.lang].loading;
      }
    }

    // AWS configuration is loaded from aws-config.js
    const s3 = new AWS.S3();
    const bucketName = AWS_CONFIG.bucketName;

    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // Three.js setup
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.xr.enabled = true;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.classList.add('xr');
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
    scene.add(hemi);

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ffaa })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let model = null;
    let modelKey = null;
    let currentModelKey = null;
    let placed = false;
    let xrSession = null;
    let xrRefSpace = null;
    let viewerSpace = null;
    let hitTestSource = null;
    let currentHitPose = null;

    const loader = new GLTFLoader();

    function loadModelByPrefix(prefixVal) {
      return new Promise((resolve, reject) => {
        loadedBytes = 0;
        
        s3.listObjectsV2({ Bucket: bucketName, Prefix: prefixVal }, (err, data) => {
          if (err) {
            console.error('Error fetching bucket contents:', err);
            reject(err);
            return;
          }
          
          if (!data || !data.Contents || data.Contents.length === 0) {
            reject(new Error('No object found for prefix'));
            return;
          }
          
          const key = data.Contents[0].Key;
          const ext = key.split('.').pop().toLowerCase();
          
          if (ext !== 'glb' && ext !== 'gltf') {
            reject(new Error('Unsupported file type. Use glb/gltf'));
            return;
          }
          
          const params = { Bucket: bucketName, Key: key };
          
          // Get file metadata first for progress tracking
          s3.headObject(params, (err, metadata) => {
            if (err) {
              console.error('Error getting file metadata:', err);
              reject(err);
              return;
            }
            
            const totalBytes = metadata.ContentLength;
            showLoadingScreen(true, totalBytes);
            
            // Download with progress tracking
            s3.getObject(params)
              .on('httpDownloadProgress', (progress) => {
                loadedBytes = progress.loaded;
              })
              .send((err, data) => {
                if (err) {
                  console.error('Error loading object:', err);
                  showLoadingScreen(false);
                  reject(err);
                  return;
                }
                
                // Create URL from downloaded data
                const fileUrl = `https://${bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${key}`;
                
                // Load the model using GLTFLoader
                loader.load(fileUrl, (gltf) => {
                  model = gltf.scene;
                  model.visible = false;
                  model.scale.setScalar(1.0);
                  scene.add(model);
                  modelKey = prefixVal;
                  currentModelKey = key;
                  showLoadingScreen(false);
                  resolve({ key, url: fileUrl });
                }, undefined, (e) => {
                  showLoadingScreen(false);
                  reject(e);
                });
              });
          });
        });
      });
    }

    // Auto-load model from URL parameter
    async function autoLoadModel() {
      const urlModelKey = getQueryParam('model');
      if (!urlModelKey || urlModelKey.length !== 10) {
        const currentLang = document.documentElement.lang;
        status.textContent = textContent[currentLang].statusError;
        status.style.color = '#f00';
        return;
      }

      status.textContent = textContent[document.documentElement.lang].statusLoading;
      try {
        await loadModelByPrefix(urlModelKey);
        status.textContent = textContent[document.documentElement.lang].statusLoaded;
        status.style.color = '#0f0';
        startARBtn.disabled = false;
      } catch (e) {
        console.error(e);
        const currentLang = document.documentElement.lang;
        status.textContent = `${textContent[currentLang].statusError}: ${e.message}`;
        status.style.color = '#f00';
      }
    }

    async function startAR() {
      if (!navigator.xr) {
        alert('WebXR غير مدعوم على هذا الجهاز/المتصفح.');
        return;
      }
      try {
        xrSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor'],
          optionalFeatures: ['anchors', 'dom-overlay'],
          domOverlay: { root: xrOverlay }
        });
        renderer.xr.setSession(xrSession);
        xrRefSpace = await xrSession.requestReferenceSpace('local-floor');
        viewerSpace = await xrSession.requestReferenceSpace('viewer');
        const hitSource = await xrSession.requestHitTestSource({ space: viewerSpace });
        hitTestSource = hitSource;

        // Hide main UI and show XR overlay
        document.getElementById('ui').style.display = 'none';
        document.getElementById('lang-toggle').style.display = 'none';
        xrSurfaceIndicator.style.display = 'block';
        
        xrSession.addEventListener('end', () => {
          xrSession = null; hitTestSource = null; placed = false; reticle.visible = false;
          document.getElementById('ar-overlay').style.display = 'none';
          xrControls.style.display = 'none';
          xrSurfaceIndicator.style.display = 'none';
          document.getElementById('ui').style.display = 'block';
          document.getElementById('lang-toggle').style.display = 'block';
          status.textContent = textContent[document.documentElement.lang].statusReady;
        });

        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        status.textContent = textContent[document.documentElement.lang].statusAR;
        renderer.setAnimationLoop(onXRFrame);
      } catch (e) {
        console.error(e);
        alert('فشل بدء جلسة AR: ' + e.message);
      }
    }

    function onXRFrame(time, frame) {
      const session = renderer.xr.getSession();
      if (!session || !hitTestSource) return;
      const pose = frame.getViewerPose(xrRefSpace);
      if (!pose) return;

      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0) {
        const hit = results[0];
        const hitPose = hit.getPose(xrRefSpace);
        currentHitPose = hitPose;
        reticle.visible = true;
        reticle.matrix.fromArray(hitPose.transform.matrix);
      } else {
        reticle.visible = false;
      }

      renderer.render(scene, camera);
    }

    async function onSelect() {
      if (!currentHitPose || !model) return;
      // Place model at reticle
      const m = new THREE.Matrix4().fromArray(currentHitPose.transform.matrix);
      const pos = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scl = new THREE.Vector3();
      m.decompose(pos, quat, scl);

      model.position.copy(pos);
      model.quaternion.copy(quat);
      model.visible = true;
      placed = true;
      
      // Hide surface indicator and show controls
      xrSurfaceIndicator.style.display = 'none';
      xrControls.style.display = 'block';
      
      // Sync scale with XR controls
      xrScaleInput.value = model.scale.x;
      xrScaleVal.textContent = `${model.scale.x.toFixed(2)}×`;

      // Try anchors API if available
      const session = renderer.xr.getSession();
      const frame = session?.requestAnimationFrame ? null : null; // placeholder; anchors handled via result.createAnchor when available
      // Some runtimes expose createAnchor on hit test result; keep best-effort approach
      // We still keep the transform in our own scene for persistence in this session.
    }

    startARBtn.addEventListener('click', startAR);

    // XR Scale control
    xrScaleInput.addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      xrScaleVal.textContent = `${s.toFixed(2)}×`;
      if (model && placed) {
        model.scale.setScalar(s);
      }
    });
    
    // XR Rotate control
    xrRotateInput.addEventListener('input', (e) => {
      const deg = parseFloat(e.target.value);
      xrRotateVal.textContent = `${deg}°`;
      if (model && placed) {
        model.rotation.y = (deg * Math.PI) / 180;
      }
    });
    
    // XR Reset button
    xrResetBtn.addEventListener('click', () => {
      if (model) {
        model.visible = false;
        placed = false;
        xrControls.style.display = 'none';
        xrSurfaceIndicator.style.display = 'block';
        reticle.visible = false;
      }
    });
    
    // XR Save to AWS button
    xrSaveAWSBtn.addEventListener('click', async () => {
      if (!model || !placed || !modelKey || !currentModelKey) {
        const currentLang = document.documentElement.lang;
        const msg = currentLang === 'ar' ? 'لا توجد بيانات تثبيت لحفظها' : 'No pin data to save';
        alert(msg);
        return;
      }

      const pinData = {
        position: { x: model.position.x, y: model.position.y, z: model.position.z },
        quaternion: { x: model.quaternion.x, y: model.quaternion.y, z: model.quaternion.z, w: model.quaternion.w },
        scale: { x: model.scale.x, y: model.scale.y, z: model.scale.z },
        rotation: { y: model.rotation.y }
      };

      const pinDataString = JSON.stringify(pinData);
      const encodedPinData = btoa(pinDataString);
      const fileExt = currentModelKey.split('.').pop();
      const newKey = `${modelKey}_${encodedPinData}.${fileExt}`;

      try {
        const currentLang = document.documentElement.lang;
        document.getElementById('xr-status').textContent = currentLang === 'ar' ? 'جار الحفظ...' : 'Saving...';
        
        await s3.copyObject({
          Bucket: bucketName,
          CopySource: `${bucketName}/${currentModelKey}`,
          Key: newKey
        }).promise();

        await s3.deleteObject({
          Bucket: bucketName,
          Key: currentModelKey
        }).promise();

        currentModelKey = newKey;
        const msg = currentLang === 'ar' ? 'تم الحفظ بنجاح!' : 'Saved successfully!';
        document.getElementById('xr-status').textContent = msg;
        document.getElementById('xr-status').style.color = '#0f0';
        
        setTimeout(() => {
          if (xrSession) xrSession.end();
        }, 2000);
      } catch (e) {
        console.error('Error saving pin data to AWS:', e);
        const currentLang = document.documentElement.lang;
        const msg = currentLang === 'ar' ? 'فشل الحفظ: ' + e.message : 'Save failed: ' + e.message;
        document.getElementById('xr-status').textContent = msg;
        document.getElementById('xr-status').style.color = '#f00';
      }
    });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // Initialize Arabic as default and auto-load model
    setLang('ar');
    autoLoadModel();
  </script>
</body>
</html>
