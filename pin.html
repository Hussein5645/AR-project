<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
    <title>AR Model Viewer</title>
    
    <!-- AR.js and A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
    <script src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
    
    <!-- AWS SDK for S3 -->
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
    <script src="aws-config.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
        }

        #arContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
        }

        button:hover {
            background: #0051D5;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .control-group label {
            color: white;
            font-size: 12px;
            margin: 0 5px;
        }

        .control-group input[type="range"] {
            width: 80px;
            height: 4px;
            cursor: pointer;
        }

        .status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
            font-family: 'Courier New', monospace;
        }

        .status-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff0000;
        }

        .status-dot.active {
            background: #00ff00;
        }

        .instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #aaa;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 250px;
            z-index: 100;
            line-height: 1.6;
        }

        .instructions strong {
            color: #fff;
        }

        .controls-info {
            background: rgba(0, 0, 0, 0.7);
            color: #aaa;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }

        #error-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 200;
            display: none;
            max-width: 500px;
            text-align: center;
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: #00ff00;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="arContainer">
        <!-- A-Frame AR Scene -->
        <a-scene 
            id="arScene"
            embedded 
            vr-mode-ui="false"
            arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
            renderer="antialias: true; alpha: true; precision: mediump;"
        >
            <!-- Surface-based Camera (for flat surface detection) -->
            <a-camera id="surfaceCamera" position="0 1.6 0"></a-camera>
            
            <!-- Location-based Camera (for GPS) -->
            <a-camera id="gpsCamera" gps-new-camera="gpsMinDistance: 5"></a-camera>

            <!-- 3D Model Entity (Surface-based) -->
            <a-entity 
                id="model" 
                gltf-model=""
                scale="1 1 1"
                position="0 0 -2"
                rotation="0 0 0"
                geometry="primitive: box; width: 0.1; height: 0.1; depth: 0.1"
                material="color: #0084FF; opacity: 0.5"
            ></a-entity>

            <!-- 3D Model Entity (GPS-based) -->
            <a-entity 
                id="gpsModel"
                gltf-model=""
                scale="1 1 1"
                rotation="0 0 0"
                gps-new-entity-place=""
                visible="false"
            ></a-entity>

            <!-- Placeholder for surface indicator -->
            <a-entity 
                id="surface-indicator"
                geometry="primitive: plane; width: 1.5; height: 1.5"
                material="color: #00ff00; opacity: 0.2; side: double"
                position="0 0 -2"
                rotation="-90 0 0"
                visible="false"
            ></a-entity>
        </a-scene>
    </div>

    <!-- Status Panel -->
    <div class="status">
        <div class="status-item">
            <span class="status-dot" id="camera-status"></span>
            <span>Camera: <span id="camera-text">Initializing...</span></span>
        </div>
        <div class="status-item">
            <span class="status-dot" id="model-status"></span>
            <span>Model: <span id="model-text">Waiting for URL...</span></span>
        </div>
        <div class="status-item">
            <span class="status-dot" id="tracking-status"></span>
            <span>Tracking: <span id="tracking-text">Initializing...</span></span>
        </div>
        <div id="loading-progress" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span id="progress-text">Loading model: 0%</span>
        </div>
    </div>

    <!-- Instructions Panel -->
    <div class="instructions">
        <strong>AR Modes:</strong><br>
        🎯 <strong>Surface AR:</strong> Tap to place<br>
        📍 <strong>GPS AR:</strong> Auto-placed<br>
        <strong>URL Parameters:</strong><br>
        Surface: ?modelUrl=https://...<br>
        GPS: ?model=KEY&lat=XX&lon=YY
    </div>

    <!-- Error Message -->
    <div id="error-message"></div>

    <!-- Controls -->
    <div class="ui-overlay">
        <button id="mode-toggle-btn">🎯 Surface Mode</button>
        <button id="place-btn" disabled>📍 Place on Surface</button>
        
        <div class="control-group">
            <label>Scale:</label>
            <input type="range" id="scale-input" min="0.1" max="5" step="0.1" value="1" disabled>
            <span id="scale-value">1</span>x
        </div>

        <div class="control-group">
            <label>Rotate Y:</label>
            <input type="range" id="rotate-input" min="0" max="360" step="5" value="0" disabled>
        </div>

        <button id="reset-btn" disabled>🔄 Reset</button>
        <button id="screenshot-btn" disabled>📸 Screenshot</button>

        <div class="controls-info" id="mode-info">
            Surface AR: Rotate device to move model
        </div>
    </div>

    <script>
        // ==================== Configuration ====================
        const CONFIG = {
            defaultScale: 1,
            maxScale: 5,
            minScale: 0.1,
            scaleStep: 0.1,
            placementDistance: 2,
            modes: {
                SURFACE: 'surface',
                GPS: 'gps'
            }
        };

        // ==================== State Management ====================
        const state = {
            modelUrl: null,
            modelLoaded: false,
            modelPlaced: false,
            cameraReady: false,
            trackingInitialized: false,
            surfaceDetected: false,
            currentScale: CONFIG.defaultScale,
            currentRotation: { x: 0, y: 0, z: 0 },
            arMode: CONFIG.modes.SURFACE,
            gpsLocation: { lat: null, lon: null },
            hasGpsCoordinates: false,
        };

        // ==================== DOM Elements ====================
        const elements = {
            arScene: document.getElementById('arScene'),
            model: document.getElementById('model'),
            gpsModel: document.getElementById('gpsModel'),
            surfaceCamera: document.getElementById('surfaceCamera'),
            gpsCamera: document.getElementById('gpsCamera'),
            surfaceIndicator: document.getElementById('surface-indicator'),
            modeToggleBtn: document.getElementById('mode-toggle-btn'),
            placeBtn: document.getElementById('place-btn'),
            scaleInput: document.getElementById('scale-input'),
            scaleValue: document.getElementById('scale-value'),
            rotateInput: document.getElementById('rotate-input'),
            resetBtn: document.getElementById('reset-btn'),
            screenshotBtn: document.getElementById('screenshot-btn'),
            modeInfo: document.getElementById('mode-info'),
            cameraStatus: document.getElementById('camera-status'),
            cameraText: document.getElementById('camera-text'),
            modelStatus: document.getElementById('model-status'),
            modelText: document.getElementById('model-text'),
            trackingStatus: document.getElementById('tracking-status'),
            trackingText: document.getElementById('tracking-text'),
            errorMessage: document.getElementById('error-message'),
            loadingProgress: document.getElementById('loading-progress'),
            progressFill: document.getElementById('progress-fill'),
            progressText: document.getElementById('progress-text'),
        };

        // ==================== URL Parameter Extraction ====================
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function getModelUrlFromParams() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Check if modelUrl is provided directly
            const modelUrl = urlParams.get('modelUrl');
            if (modelUrl) {
                return modelUrl;
            }

            // Check if model key is provided (fetch from AWS S3)
            const modelKey = urlParams.get('model');
            if (modelKey) {
                return await fetchModelFromS3(modelKey);
            }

            return null;
        }

        function getGPSCoordinatesFromParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const lat = parseFloat(urlParams.get('lat'));
            const lon = parseFloat(urlParams.get('lon'));
            
            if (!isNaN(lat) && !isNaN(lon)) {
                state.gpsLocation = { lat, lon };
                state.hasGpsCoordinates = true;
                return true;
            }
            return false;
        }

        async function fetchModelFromS3(modelPrefix) {
            try {
                updateStatus('model', false, 'Fetching from S3...');
                
                const s3 = new AWS.S3();
                const bucketName = AWS_CONFIG.bucketName;

                return new Promise((resolve, reject) => {
                    s3.listObjectsV2({ Bucket: bucketName, Prefix: modelPrefix }, (err, data) => {
                        if (err) {
                            showError('Error fetching model from S3: ' + err.message);
                            reject(err);
                            return;
                        }

                        if (data && data.Contents && data.Contents.length > 0) {
                            const key = data.Contents[0].Key;
                            const fileUrl = `https://${bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${key}`;
                            resolve(fileUrl);
                        } else {
                            const error = 'No model found with key: ' + modelPrefix;
                            showError(error);
                            reject(new Error(error));
                        }
                    });
                });
            } catch (error) {
                showError('S3 fetch error: ' + error.message);
                throw error;
            }
        }

        // ==================== Status Updates ====================
        function updateStatus(type, status, text) {
            const statusElement = elements[`${type}Status`];
            const textElement = elements[`${type}Text`];
            
            if (statusElement) {
                statusElement.classList.toggle('active', status);
            }
            if (textElement) {
                textElement.textContent = text;
            }
        }

        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.style.display = 'block';
            console.error(message);
            setTimeout(() => {
                elements.errorMessage.style.display = 'none';
            }, 5000);
        }

        function showLoadingProgress(percent) {
            elements.loadingProgress.style.display = 'block';
            elements.progressFill.style.width = percent + '%';
            elements.progressText.textContent = `Loading model: ${Math.round(percent)}%`;
        }

        function hideLoadingProgress() {
            elements.loadingProgress.style.display = 'none';
        }

        // ==================== Model Loading ====================
        async function loadModel(url) {
            if (!url) {
                updateStatus('model', false, 'No URL provided');
                showError('No model URL provided. Use: ?modelUrl=your-url');
                return;
            }

            updateStatus('model', false, 'Loading...');
            state.modelUrl = url;

            try {
                showLoadingProgress(0);

                // Simulate progress for better UX
                const progressInterval = setInterval(() => {
                    const currentPercent = parseFloat(elements.progressFill.style.width);
                    if (currentPercent < 90) {
                        showLoadingProgress(currentPercent + Math.random() * 20);
                    }
                }, 300);

                // Load model with CORS handling
                await new Promise((resolve, reject) => {
                    const modelEntity = elements.model;
                    
                    const onLoad = () => {
                        clearInterval(progressInterval);
                        showLoadingProgress(100);
                        state.modelLoaded = true;
                        updateStatus('model', true, 'Ready to place');
                        elements.placeBtn.disabled = false;
                        setTimeout(hideLoadingProgress, 500);
                        resolve();
                    };

                    const onError = () => {
                        clearInterval(progressInterval);
                        hideLoadingProgress();
                        reject(new Error('Failed to load model. Check URL and CORS headers.'));
                    };

                    modelEntity.addEventListener('model-loaded', onLoad, { once: true });
                    modelEntity.addEventListener('model-error', onError, { once: true });

                    // Set timeout for loading
                    setTimeout(() => {
                        if (!state.modelLoaded) {
                            onError();
                        }
                    }, 15000);

                    modelEntity.setAttribute('gltf-model', url);
                    modelEntity.setAttribute('visible', 'true');
                });

            } catch (error) {
                showError(`Model loading failed: ${error.message}`);
                updateStatus('model', false, 'Load failed');
            }
        }

        // ==================== Model Placement ====================
        function placeModelOnSurface() {
            if (!state.modelLoaded) {
                showError('Model not loaded yet');
                return;
            }

            state.modelPlaced = true;
            
            // Position model in front of camera at fixed distance
            elements.model.setAttribute('position', `0 0 -${CONFIG.placementDistance}`);
            elements.surfaceIndicator.setAttribute('position', `0 0 -${CONFIG.placementDistance}`);
            elements.surfaceIndicator.setAttribute('visible', 'true');

            // Enable controls
            elements.placeBtn.textContent = '✓ Placed';
            elements.placeBtn.disabled = true;
            elements.scaleInput.disabled = false;
            elements.rotateInput.disabled = false;
            elements.resetBtn.disabled = false;
            elements.screenshotBtn.disabled = false;

            console.log('Model placed on surface');
        }

        // ==================== Model Controls ====================
        function updateModelScale(scale) {
            state.currentScale = parseFloat(scale);
            elements.model.setAttribute('scale', `${scale} ${scale} ${scale}`);
            elements.scaleValue.textContent = scale;
        }

        function updateModelRotation(angleY) {
            state.currentRotation.y = parseFloat(angleY);
            const { x, y, z } = state.currentRotation;
            elements.model.setAttribute('rotation', `${x} ${y} ${z}`);
        }

        function resetModel() {
            state.currentScale = CONFIG.defaultScale;
            state.currentRotation = { x: 0, y: 0, z: 0 };
            
            elements.scaleInput.value = CONFIG.defaultScale;
            elements.scaleValue.textContent = CONFIG.defaultScale;
            elements.rotateInput.value = 0;
            
            updateModelScale(CONFIG.defaultScale);
            updateModelRotation(0);
            
            console.log('Model reset to default');
        }

        // ==================== Screenshot Functionality ====================
        function takeScreenshot() {
            const scene = document.querySelector('a-scene').renderer;
            scene.render(scene.getContext(), scene.getContext().canvas);
            
            const canvas = scene.getContext().canvas;
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `ar-model-${Date.now()}.png`;
                link.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        // ==================== Camera Initialization ====================
        function initializeCamera() {
            const scene = document.querySelector('a-scene');
            
            console.log('Initializing camera...');
            
            // Wait for A-Frame scene to be ready
            if (scene.hasLoaded) {
                setupCamera();
            } else {
                scene.addEventListener('loaded', setupCamera);
            }
        }

        function setupCamera() {
            console.log('Setting up camera feed...');
            
            // Request camera permissions
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false 
                })
                    .then(stream => {
                        console.log('Camera stream obtained:', stream);
                        updateStatus('camera', true, 'Camera Ready');
                        state.cameraReady = true;
                        
                        // Stop the stream as AR.js will handle it
                        stream.getTracks().forEach(track => track.stop());
                    })
                    .catch(error => {
                        console.error('Camera access error:', error);
                        showError('❌ Camera access denied.\n\nPlease allow camera permissions in your browser settings.');
                        updateStatus('camera', false, 'Access Denied');
                        
                        // Provide fallback instructions
                        setTimeout(() => {
                            showError('📱 Mobile devices: Check browser settings\n💻 Desktop: Allow camera access when prompted');
                        }, 3000);
                    });
            } else {
                console.error('getUserMedia not supported');
                showError('Your browser does not support camera access');
                updateStatus('camera', false, 'Not Supported');
            }
            
            // Set a timeout to mark camera as initialized even if permission denied
            setTimeout(() => {
                if (!state.cameraReady) {
                    updateStatus('camera', true, 'Attempting...');
                    state.cameraReady = true;
                }
            }, 3000);
        }

        // ==================== Tracking Detection ====================
        function initializeTracking() {
            const scene = document.querySelector('a-scene');
            
            // AR.js emits arjs-session-start when tracking is ready
            document.addEventListener('arjs-session-start', () => {
                updateStatus('tracking', true, 'Tracking Active');
                state.trackingInitialized = true;
                state.surfaceDetected = true;
                console.log('Surface detected and tracking started');
            });

            // Fallback: check if AR session exists
            setTimeout(() => {
                if (navigator.xr) {
                    updateStatus('tracking', true, 'Tracking Ready');
                    state.trackingInitialized = true;
                } else if (state.cameraReady) {
                    // Fallback for non-XR browsers
                    updateStatus('tracking', true, 'Basic Mode');
                    state.trackingInitialized = true;
                }
            }, 2000);
        }

        // ==================== AR Mode Management ====================
        function toggleARMode() {
            if (!state.modelLoaded) {
                showError('Model not loaded yet');
                return;
            }

            if (state.arMode === CONFIG.modes.SURFACE) {
                // Switch to GPS mode
                if (!state.hasGpsCoordinates) {
                    showError('GPS coordinates not provided.\n\nUse: ?lat=XX.XXXX&lon=YY.YYYY');
                    return;
                }
                switchToGPSMode();
            } else {
                // Switch to Surface mode
                switchToSurfaceMode();
            }
        }

        function switchToSurfaceMode() {
            state.arMode = CONFIG.modes.SURFACE;
            
            // Update UI
            elements.modeToggleBtn.textContent = '🎯 Surface Mode';
            elements.modeInfo.textContent = 'Surface AR: Rotate device to move model';
            elements.placeBtn.style.display = 'block';
            
            // Switch cameras and models
            elements.surfaceCamera.setAttribute('active', true);
            elements.gpsCamera.setAttribute('active', false);
            elements.model.setAttribute('visible', 'true');
            elements.gpsModel.setAttribute('visible', 'false');
            
            console.log('✅ Switched to Surface AR mode');
        }

        function switchToGPSMode() {
            state.arMode = CONFIG.modes.GPS;
            
            // Update UI
            elements.modeToggleBtn.textContent = '📍 GPS Mode';
            elements.modeInfo.textContent = `GPS AR: Placed at Lat: ${state.gpsLocation.lat.toFixed(4)}, Lon: ${state.gpsLocation.lon.toFixed(4)}`;
            elements.placeBtn.style.display = 'none';
            
            // Switch cameras and models
            elements.surfaceCamera.setAttribute('active', false);
            elements.gpsCamera.setAttribute('active', true);
            elements.model.setAttribute('visible', 'false');
            elements.gpsModel.setAttribute('visible', 'true');
            
            // Set GPS coordinates
            elements.gpsModel.setAttribute(
                'gps-new-entity-place',
                `latitude: ${state.gpsLocation.lat}; longitude: ${state.gpsLocation.lon}`
            );
            
            console.log('📍 Switched to GPS AR mode:', state.gpsLocation);
        }

        // ==================== Event Listeners ====================
        function setupEventListeners() {
            elements.modeToggleBtn.addEventListener('click', toggleARMode);
            elements.placeBtn.addEventListener('click', placeModelOnSurface);
            
            elements.scaleInput.addEventListener('input', (e) => {
                updateModelScale(e.target.value);
            });

            elements.rotateInput.addEventListener('input', (e) => {
                updateModelRotation(e.target.value);
            });

            elements.resetBtn.addEventListener('click', resetModel);
            elements.screenshotBtn.addEventListener('click', takeScreenshot);

            // Double-tap to place model
            let lastTap = 0;
            document.addEventListener('click', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                
                if (tapLength < 300 && tapLength > 0 && state.modelLoaded && !state.modelPlaced) {
                    placeModelOnSurface();
                }
                lastTap = currentTime;
            });
        }

        // ==================== Initialization ====================
        async function initialize() {
            console.log('🚀 Initializing AR Application...');
            console.log('📍 AR.js version:', AFRAME ? AFRAME.version : 'Unknown');
            
            // Setup
            setupEventListeners();
            initializeCamera();
            initializeTracking();

            // Check for GPS coordinates
            const hasGPS = getGPSCoordinatesFromParams();
            if (hasGPS) {
                elements.modeToggleBtn.disabled = false;
                console.log('📍 GPS coordinates detected');
            }

            // Get model URL from parameters (either direct URL or S3 key)
            try {
                const modelUrl = await getModelUrlFromParams();
                
                if (modelUrl) {
                    console.log('📦 Loading model from URL:', modelUrl);
                    await loadModel(modelUrl);
                    
                    // Auto-switch to GPS mode if coordinates available
                    if (hasGPS) {
                        setTimeout(() => {
                            switchToGPSMode();
                        }, 1000);
                    }
                } else {
                    updateStatus('model', false, 'Awaiting URL parameter');
                    showError('No model URL or key provided.\n\nUsage:\npin.html?modelUrl=https://...\nor\npin.html?model=KEY&lat=XX&lon=YY');
                }
            } catch (error) {
                showError('Initialization error: ' + error.message);
                updateStatus('model', false, 'Error');
                console.error('Initialization error:', error);
            }

            // Display instructions
            console.log('✅ AR.js Application Ready');
            console.log('⏳ Waiting for surface detection...');
            console.log('🎥 Check browser console for detailed logs');
        }

        // Start when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM Content Loaded');
            setTimeout(initialize, 500);
        });

        // Fallback initialization if A-Frame loads quickly
        window.addEventListener('load', () => {
            console.log('🪟 Window Load Event');
            if (!state.cameraReady) {
                setTimeout(() => {
                    if (!state.cameraReady) {
                        console.log('⚠️ Camera still not ready, checking A-Frame scene...');
                        const scene = document.querySelector('a-scene');
                        if (scene && scene.hasLoaded) {
                            setupCamera();
                        }
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
