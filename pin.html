<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WebXR AR Demo</title>
    <link rel="stylesheet" href="css/common.css" />
    <style>
        html, body { height: 100%; margin: 0; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
    </style>
</head>
<body>
    <canvas id="renderCanvas" touch-action="none"></canvas>

    <!-- Babylon dependencies -->
    <script src="lib/babylon/babylon.js"></script>
    <script src="lib/babylon/babylon.gui.min.js"></script>
    <script src="lib/babylon/babylon.loaders.js"></script>

    <!-- Scene script -->
    <script type="module">
        const canvas = document.getElementById('renderCanvas');
        let engine;

        /**
         * WebXR ar demo using hit-test, anchors, and depth sensing
         * Every press on the screen will add a figure in the requested position.
         * Created by Raanan Weber (@RaananW) — adapted into a proper HTML file.
         */

        var createScene = async function () {
            var scene = new BABYLON.Scene(engine);

            var camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 1, -5), scene);
            camera.setTarget(BABYLON.Vector3.Zero());
            camera.attachControl(canvas, true);

            const arAvailable = await BABYLON.WebXRSessionManager.IsSessionSupportedAsync('immersive-ar');

            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("FullscreenUI");
            const rectangle = new BABYLON.GUI.Rectangle("rect");
            rectangle.background = "black";
            rectangle.color = "blue";
            rectangle.width = "80%";
            rectangle.height = "50%";
            advancedTexture.addControl(rectangle);
            const nonXRPanel = new BABYLON.GUI.StackPanel();
            rectangle.addControl(nonXRPanel);

            const text1 = new BABYLON.GUI.TextBlock("text1");
            text1.fontFamily = "Helvetica";
            text1.textWrapping = true;
            text1.color = "white";
            text1.fontSize = "14px";
            text1.height = "400px";
            text1.paddingLeft = "10px";
            text1.paddingRight = "10px";

            if (!arAvailable) {
                text1.text = "AR is not available in your system. Use a supported device and browser.";
                nonXRPanel.addControl(text1);
                return scene;
            } else {
                text1.text = "WebXR Demo: Hit test and depth sensing. Enter AR to start.";
                nonXRPanel.addControl(text1);
            }

            var light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;
            var dirLight = new BABYLON.DirectionalLight('light', new BABYLON.Vector3(0, -1, -0.5), scene);
            dirLight.position = new BABYLON.Vector3(0, 5, -5);

            var shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            const model = await BABYLON.ImportMeshAsync("./scenes/dummy3.babylon", scene).catch(()=>{return {meshes:[],skeletons:[]};});

            const xr = await scene.createDefaultXRExperienceAsync({
                uiOptions: { sessionMode: 'immersive-ar' },
                inputOptions: { doNotLoadControllerMeshes: true },
                handSupportOptions: {
                    handMeshes: { disableDefaultMeshes: true },
                    jointMeshes: { keepOriginalVisible: false, invisible: true }
                }
            });

            xr.baseExperience.sessionManager.onXRSessionInit.add(() => { rectangle.isVisible = false; });
            xr.baseExperience.sessionManager.onXRSessionEnded.add(() => { rectangle.isVisible = true; });

            xr.baseExperience.featuresManager.enableFeature(BABYLON.WebXRFeatureName.DEPTH_SENSING, "latest", {
                dataFormatPreference: ["ushort", "float"], usagePreference: ["cpu", "gpu"],
            });

            const fm = xr.baseExperience.featuresManager;
            const xrTest = fm.enableFeature(BABYLON.WebXRHitTest.Name, "latest");
            const anchors = fm.enableFeature(BABYLON.WebXRAnchorSystem.Name, 'latest');
            fm.enableFeature(BABYLON.WebXRBackgroundRemover.Name);

            let b = (model.meshes && model.meshes[0]) || new BABYLON.Mesh.CreateBox('placeholder', 0.1, scene);
            b.rotationQuaternion = new BABYLON.Quaternion();
            shadowGenerator.addShadowCaster(b, true);

            const marker = BABYLON.MeshBuilder.CreateTorus('marker', { diameter: 0.15, thickness: 0.05 });
            marker.isVisible = false;
            marker.rotationQuaternion = new BABYLON.Quaternion();

            var skeleton = (model.skeletons && model.skeletons[0]) || null;
            if (skeleton) {
                skeleton.animationPropertiesOverride = new BABYLON.AnimationPropertiesOverride();
                skeleton.animationPropertiesOverride.enableBlending = true;
                skeleton.animationPropertiesOverride.blendingSpeed = 0.05;
                skeleton.animationPropertiesOverride.loopMode = 1;
                var idleRange = skeleton.getAnimationRange("YBot_Idle");
                if (idleRange) scene.beginAnimation(skeleton, idleRange.from, idleRange.to, true);
            }

            let hitTest;
            b.isVisible = !!(model.meshes && model.meshes.length);

            xrTest.onHitTestResultObservable.add((results) => {
                if (results.length) {
                    marker.isVisible = true;
                    hitTest = results[0];
                    hitTest.transformationMatrix.decompose(undefined, b.rotationQuaternion, b.position);
                    hitTest.transformationMatrix.decompose(undefined, marker.rotationQuaternion, marker.position);
                } else {
                    marker.isVisible = false;
                    hitTest = undefined;
                }
            });

            if (anchors) {
                anchors.onAnchorAddedObservable.add(anchor => {
                    b.isVisible = true;
                    anchor.attachedNode = b.clone("mensch");
                    if (skeleton) anchor.attachedNode.skeleton = skeleton.clone('skelet');
                    shadowGenerator.addShadowCaster(anchor.attachedNode, true);
                    if (skeleton) scene.beginAnimation(anchor.attachedNode.skeleton, 0, 100, true);
                    b.isVisible = false;
                });

                anchors.onAnchorRemovedObservable.add(anchor => {
                    if (anchor && anchor.attachedNode) {
                        anchor.attachedNode.isVisible = false;
                        anchor.attachedNode.dispose();
                    }
                });
            }

            scene.onPointerDown = () => {
                if (hitTest && anchors && xr.baseExperience.state === BABYLON.WebXRState.IN_XR) {
                    anchors.addAnchorPointUsingHitTestResultAsync(hitTest);
                }
            };

            return scene;
        };

        function start() {
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            createScene().then(scene => {
                engine.runRenderLoop(() => { if (scene) scene.render(); });
                window.addEventListener('resize', () => engine.resize());
            }).catch(err => console.error(err));
        }

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    </script>
</body>
</html>
