<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer - MindAR</title>
    <script src="aws-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        #ar-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            display: block;
        }

        #model-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 50px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #51cf66;
        }

        .loading {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="ar-container">
        <video id="camera-feed" playsinline autoplay></video>
        <canvas id="ar-canvas" style="position: absolute; width: 100%; height: 100%;"></canvas>
    </div>

    <div class="status" id="status">
        Initializing AR...
    </div>

    <div class="controls">
        <button id="load-model-btn" disabled>Load Model</button>
        <button id="reset-btn">Reset</button>
    </div>

    <script type="module" src="lib/mindar/mindar-image.prod.js"></script>
    <script type="module">
        import { Controller, Compiler, UI } from './lib/mindar/mindar-image.prod.js';

        let runtime = null;
        let modelUrl = null;
        const statusEl = document.getElementById('status');
        const loadModelBtn = document.getElementById('load-model-btn');
        const resetBtn = document.getElementById('reset-btn');
        const canvas = document.getElementById('ar-canvas');
        const video = document.getElementById('camera-feed');

        // Get model URL from query parameter
        function getModelUrlFromParams() {
            const params = new URLSearchParams(window.location.search);
            return params.get('modelUrl') || params.get('key');
        }

        // Update status message
        function updateStatus(message, isError = false) {
            statusEl.innerHTML = message;
            statusEl.className = isError ? 'status error' : 'status';
        }

        // Fetch model from S3
        async function loadModelFromS3(key) {
            try {
                updateStatus('Fetching model from S3...');
                
                const s3 = new AWS.S3();
                const params = {
                    Bucket: window.AWS_CONFIG.bucket,
                    Key: key
                };

                const data = await s3.getObject(params).promise();
                const blob = new Blob([data.Body], { type: data.ContentType });
                return URL.createObjectURL(blob);
            } catch (error) {
                console.error('Error fetching from S3:', error);
                updateStatus(`Error loading model: ${error.message}`, true);
                throw error;
            }
        }

        // Initialize AR
        async function initializeAR() {
            try {
                updateStatus('Initializing AR engine...');
                
                const container = document.getElementById('ar-container');
                runtime = new Controller({
                    canvas: canvas,
                    maxTrack: 1,
                    uiLoading: 'yes',
                    filterMinCf: 0.1,
                    missTolerance: 5,
                    warmupTolerance: 5
                });

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                
                video.srcObject = stream;
                await runtime.build();
                await runtime.start();

                updateStatus('AR Ready - Point at marker', false);
                loadModelBtn.disabled = false;

                // Auto-load if URL has model parameter
                if (modelUrl) {
                    loadModel();
                }
            } catch (error) {
                console.error('AR initialization error:', error);
                updateStatus(`AR Error: ${error.message}`, true);
            }
        }

        // Load and display model
        async function loadModel() {
            try {
                if (!modelUrl) {
                    updateStatus('No model URL provided', true);
                    return;
                }

                updateStatus('Loading model...', false);
                loadModelBtn.disabled = true;

                const ctx = canvas.getContext('webgl', { preserveDrawingBuffer: true });
                
                // Load model based on type
                if (modelUrl.endsWith('.gltf') || modelUrl.endsWith('.glb')) {
                    await loadGLTFModel(ctx, modelUrl);
                } else if (modelUrl.endsWith('.obj')) {
                    await loadOBJModel(ctx, modelUrl);
                } else {
                    updateStatus('Unsupported model format', true);
                    loadModelBtn.disabled = false;
                }
            } catch (error) {
                console.error('Model loading error:', error);
                updateStatus(`Error: ${error.message}`, true);
                loadModelBtn.disabled = false;
            }
        }

        // Load GLTF/GLB model
        async function loadGLTFModel(ctx, url) {
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                
                updateStatus(`<span class="loading"></span> Rendering model...`);
                
                // Model loaded successfully
                updateStatus('Model loaded successfully!');
                loadModelBtn.disabled = false;
            } catch (error) {
                throw new Error(`Failed to load GLTF model: ${error.message}`);
            }
        }

        // Load OBJ model
        async function loadOBJModel(ctx, url) {
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                updateStatus(`<span class="loading"></span> Rendering model...`);
                
                // Model loaded successfully
                updateStatus('Model loaded successfully!');
                loadModelBtn.disabled = false;
            } catch (error) {
                throw new Error(`Failed to load OBJ model: ${error.message}`);
            }
        }

        // Reset AR
        function reset() {
            if (runtime) {
                updateStatus('AR Ready - Point at marker');
            }
            loadModelBtn.disabled = false;
        }

        // Event listeners
        loadModelBtn.addEventListener('click', loadModel);
        resetBtn.addEventListener('click', reset);

        // Initialize on load
        window.addEventListener('load', async () => {
            modelUrl = getModelUrlFromParams();
            if (!modelUrl) {
                updateStatus('Please provide a model URL using ?modelUrl=... or ?key=...', false);
            }
            await initializeAR();
        });

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            if (runtime) {
                runtime.stop();
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
