<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR.js - Load Model from AWS</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/aframe-ar.js"></script>
    <script src="aws-config.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1600.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #arScene {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #ui-container {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .control-group {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #00bfff;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00bfff 0%, #0080ff 100%);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 191, 255, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: #fff;
            margin-top: 5px;
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }
        
        #status {
            color: #00ff00;
            font-size: 12px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-left: 3px solid #00ff00;
            border-radius: 3px;
            display: none;
        }
        
        #status.error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-left-color: #ff6b6b;
        }
        
        #status.show {
            display: block;
        }
        
        .info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            font-size: 12px;
            max-width: 300px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .info-panel h3 {
            margin-bottom: 10px;
            color: #00bfff;
        }
        
        .info-panel p {
            margin: 5px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <a-scene 
        id="arScene"
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: color_and_matrix; matrixCodeType: 3x3;">
        <a-camera position="0 0 0"></a-camera>
        <a-entity id="model-container" position="0 0 -5"></a-entity>
    </a-scene>

    <div id="ui-container">
        <div class="control-group">
            <label for="modelKey">Model S3 Key:</label>
            <input 
                type="text" 
                id="modelKey" 
                placeholder="e.g., models/chair.gltf" 
                value="models/chair.gltf">
            <button id="loadBtn" class="btn-primary">Load Model from AWS</button>
            <button id="clearBtn" class="btn-secondary">Clear Model</button>
            <div id="status"></div>
        </div>
    </div>

    <div class="info-panel">
        <h3>Controls</h3>
        <p><strong>1.</strong> Point camera at QR code</p>
        <p><strong>2.</strong> Enter S3 model key</p>
        <p><strong>3.</strong> Click "Load Model"</p>
        <p><strong>4.</strong> Model appears on surface</p>
    </div>

    <script>
        // Initialize AWS SDK
        AWS.config.update({
            accessKeyId: AWS_CONFIG.accessKeyId,
            secretAccessKey: AWS_CONFIG.secretAccessKey,
            region: AWS_CONFIG.region
        });

        const s3 = new AWS.S3();
        const bucket = AWS_CONFIG.bucketName;
        let currentModel = null;

        const modelKeyInput = document.getElementById('modelKey');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusDiv = document.getElementById('status');
        const modelContainer = document.getElementById('model-container');

        // Utility function to show status messages
        function showStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.classList.add('show');
            statusDiv.classList.toggle('error', isError);
            
            if (!isError) {
                setTimeout(() => {
                    statusDiv.classList.remove('show');
                }, 3000);
            }
        }

        // Generate signed URL from AWS S3
        async function getModelUrl(key) {
            return new Promise((resolve, reject) => {
                const params = {
                    Bucket: bucket,
                    Key: key,
                    Expires: 3600 // URL valid for 1 hour
                };

                s3.getSignedUrl('getObject', params, (err, url) => {
                    if (err) {
                        reject(err);
                    } else {
                        resolve(url);
                    }
                });
            });
        }

        // Load model from AWS S3
        async function loadModelFromAWS() {
            const key = modelKeyInput.value.trim();

            if (!key) {
                showStatus('Please enter a valid S3 key', true);
                return;
            }

            loadBtn.disabled = true;
            showStatus('Fetching model from AWS...');

            try {
                const url = await getModelUrl(key);
                showStatus('Model URL generated, loading model...');

                // Remove existing model if any
                const existingModel = modelContainer.querySelector('a-entity[gltf-model]');
                if (existingModel) {
                    existingModel.remove();
                }

                // Create and add new model entity
                const modelEntity = document.createElement('a-entity');
                modelEntity.setAttribute('gltf-model', url);
                modelEntity.setAttribute('scale', '1 1 1');
                modelEntity.setAttribute('position', '0 -0.5 0');
                modelEntity.setAttribute('rotation', '0 0 0');

                // Add animation on load
                modelEntity.addEventListener('model-loaded', () => {
                    showStatus('✓ Model loaded successfully!');
                    // Auto-rotate animation
                    modelEntity.setAttribute('animation', {
                        property: 'rotation',
                        dur: 4000,
                        loop: true,
                        to: '0 360 0'
                    });
                });

                modelEntity.addEventListener('error', (err) => {
                    showStatus('Failed to load model: ' + err.message, true);
                });

                modelContainer.appendChild(modelEntity);
                currentModel = modelEntity;

            } catch (error) {
                console.error('Error loading model:', error);
                showStatus('Error: ' + error.message, true);
            } finally {
                loadBtn.disabled = false;
            }
        }

        // Clear current model
        function clearModel() {
            if (currentModel) {
                currentModel.remove();
                currentModel = null;
                showStatus('Model cleared');
            }
        }

        // Event listeners
        loadBtn.addEventListener('click', loadModelFromAWS);
        clearBtn.addEventListener('click', clearModel);

        // Allow Enter key to load model
        modelKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadModelFromAWS();
            }
        });

        // Initialize
        showStatus('Ready to load models');
    </script>
</body>
</html>
