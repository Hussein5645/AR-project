<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pin AR Model (WebXR)</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
  <script src="aws-config.js"></script>
  <style>
    body[lang="ar"] { direction: rtl; }
    body[lang="en"] { direction: ltr; }
    body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: #fff; overflow: hidden; }
    #ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); padding: 12px; border-radius: 8px; width: calc(100% - 20px); max-width: 520px; z-index: 10; pointer-events: auto; }
    #ui h2 { margin: 0 0 8px 0; font-size: 18px; }
    #ui .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #ui input[type="text"], #ui input[type="range"] { flex: 1; padding: 8px; border: none; border-radius: 6px; background: #2a2a2a; color: #fff; }
    #ui input[type="text"]::placeholder { color: #bbb; }
    #ui button { padding: 10px 14px; border: none; border-radius: 6px; background: #007bff; color: #fff; font-weight: bold; cursor: pointer; pointer-events: auto; }
    #ui button.secondary { background: #444; }
    #ui button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { font-size: 12px; color: #bbb; margin-top: 4px; }
    #lang-toggle { position: fixed; top: 10px; right: 10px; z-index: 11; padding: 8px 12px; border-radius: 6px; background: #444; color: #fff; cursor: pointer; pointer-events: auto; }
    #preview-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 1; }
    #preview-canvas.hidden { display: none; }
    canvas.xr { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; z-index: 1; }
    canvas.xr.active { display: block; }
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; color: #fff; font-size: 1.5em; z-index: 20; transition: opacity 0.5s ease; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #ar-overlay { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px; display: none; z-index: 25; min-width: 280px; text-align: center; }
    #ar-overlay button { width: 100%; margin: 5px 0; padding: 12px; border: none; border-radius: 6px; background: #28a745; color: #fff; font-weight: bold; cursor: pointer; }
    #ar-overlay button:hover { background: #218838; }
    #ar-overlay p { margin: 5px 0; font-size: 14px; color: #bbb; }
    
    #xr-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
    #xr-overlay > * { pointer-events: auto; }
    #xr-controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 12px; display: none; min-width: 320px; }
    body[lang="ar"] #xr-controls { direction: rtl; }
    body[lang="en"] #xr-controls { direction: ltr; }
    #xr-controls h3 { margin: 0 0 15px 0; font-size: 16px; color: #fff; text-align: center; }
    #xr-controls .control-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    #xr-controls label { color: #fff; font-size: 14px; min-width: 60px; }
    #xr-controls input[type="range"] { flex: 1; }
    #xr-controls .value-display { color: #0f0; font-weight: bold; min-width: 60px; text-align: center; }
    #xr-controls button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 14px; }
    #xr-controls .btn-primary { background: #28a745; color: #fff; }
    #xr-controls .btn-primary:hover { background: #218838; }
    #xr-controls .btn-secondary { background: #6c757d; color: #fff; }
    #xr-controls .btn-secondary:hover { background: #5a6268; }
    #xr-controls .status-text { color: #ffc107; font-size: 13px; text-align: center; margin: 10px 0; }
    #xr-surface-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffaa; font-size: 18px; text-align: center; display: none; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
    #xr-surface-indicator .icon { font-size: 48px; margin-bottom: 10px; }
    #xr-pin-btn { padding: 16px 32px; border: none; border-radius: 50px; background: #00ffaa; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,255,170,0.4); transition: all 0.3s; }
    #xr-pin-btn:hover { background: #00dd88; transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,255,170,0.6); }
    #xr-pin-btn:active { transform: scale(0.95); }
    
    /* Modal Dialogs */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.show { display: flex; }
    .modal-content { background: #1e1e1e; border-radius: 12px; padding: 30px; max-width: 400px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    body[lang="ar"] .modal-content { direction: rtl; text-align: right; }
    body[lang="en"] .modal-content { direction: ltr; text-align: left; }
    .modal-content h3 { margin: 0 0 15px 0; color: #fff; font-size: 20px; }
    .modal-content p { margin: 0 0 25px 0; color: #bbb; font-size: 15px; line-height: 1.6; }
    .modal-content .icon-warning { font-size: 48px; text-align: center; margin-bottom: 15px; }
    .modal-buttons { display: flex; gap: 10px; flex-direction: column; }
    .modal-buttons button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all 0.2s; }
    .modal-buttons .btn-primary { background: #28a745; color: #fff; }
    .modal-buttons .btn-primary:hover { background: #218838; transform: translateY(-2px); }
    .modal-buttons .btn-info { background: #17a2b8; color: #fff; }
    .modal-buttons .btn-info:hover { background: #138496; transform: translateY(-2px); }
    .modal-buttons .btn-danger { background: #dc3545; color: #fff; }
    .modal-buttons .btn-danger:hover { background: #c82333; }
    .modal-buttons .btn-secondary { background: #6c757d; color: #fff; }
    .modal-buttons .btn-secondary:hover { background: #5a6268; }
  </style>
</head>
<body lang="ar">
  <canvas id="preview-canvas"></canvas>
  <div id="loading-screen" class="hidden">جار التحميل...</div>
  <button id="lang-toggle">English</button>

  <div id="ar-overlay">
    <p id="ar-overlay-text">النموذج مثبت! احفظ الموقع؟</p>
    <button id="save-pin-aws">حفظ بيانات التثبيت في AWS</button>
  </div>

  <div id="xr-overlay">
    <div id="xr-surface-indicator">
      <div class="icon">⊕</div>
      <div id="surface-text">ابحث عن سطح</div>
      <button id="xr-pin-btn">📍 تثبيت الموقع</button>
    </div>
    
    <div id="xr-controls">
      <h3 id="xr-title">إعدادات النموذج</h3>
      
      <div class="control-row">
        <label id="xr-scale-label">الحجم:</label>
        <input id="xr-scale" type="range" min="0.1" max="5" step="0.01" value="1" />
        <span id="xr-scale-val" class="value-display">1.00×</span>
      </div>
      
      <div class="control-row">
        <label id="xr-rotate-label">الدوران:</label>
        <input id="xr-rotate" type="range" min="0" max="360" step="1" value="0" />
        <span id="xr-rotate-val" class="value-display">0°</span>
      </div>
      
      <p id="xr-status" class="status-text">النموذج مثبت - اضبط الإعدادات</p>
      
      <button id="xr-save-aws" class="btn-primary">حفظ في AWS</button>
      <button id="xr-reset" class="btn-secondary">إعادة التثبيت</button>
    </div>
  </div>

  <div id="ui">
    <h2 id="title">تثبيت النموذج في الواقع المعزز</h2>

    <div class="row">
      <button id="start-ar" disabled>بدء AR (WebXR)</button>
    </div>

    <div id="status">جار تحميل النموذج...</div>
  </div>

  <!-- Modal for Pin Data Decision -->
  <div id="pin-data-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="icon-warning">⚠️</div>
      <h3 id="modal-title">بيانات تثبيت موجودة</h3>
      <p id="modal-message">هذا النموذج يحتوي على بيانات تثبيت محفوظة. ماذا تريد أن تفعل؟</p>
      <div class="modal-buttons">
        <button id="modal-view-pin" class="btn-info">👁️ عرض بيانات التثبيت الحالية</button>
        <button id="modal-overwrite" class="btn-primary">✏️ إنشاء بيانات تثبيت جديدة</button>
      </div>
    </div>
  </div>

  <!-- Modal for Errors/Alerts -->
  <div id="alert-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="alert-title">تنبيه</h3>
      <p id="alert-message"></p>
      <div class="modal-buttons">
        <button id="alert-ok" class="btn-primary">حسناً</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Language content
    const textContent = {
      ar: {
        title: 'تثبيت النموذج في الواقع المعزز',
        startAR: 'بدء AR (WebXR)',
        statusReady: 'جاهز. يتطلب Chrome على Android لدعم WebXR.',
        statusLoaded: 'تم تحميل النموذج. اضغط بدء AR.',
        statusLoading: 'جار تحميل النموذج...',
        statusError: 'خطأ: يجب تحميل نموذج من الصفحة الرئيسية أولاً',
        statusHasPinData: 'هذا النموذج يحتوي على بيانات تثبيت محفوظة',
        statusNoPinData: 'لم يتم تثبيت هذا النموذج بعد - ابدأ AR لإضافة بيانات التثبيت',
        confirmOverwrite: 'هذا النموذج يحتوي على بيانات تثبيت. هل تريد الكتابة فوقها؟\n\nاختر:\n- موافق: كتابة بيانات جديدة\n- إلغاء: عرض البيانات الحالية في showpin.html',
        loading: 'جار التحميل...',
        arOverlay: 'النموذج مثبت! احفظ الموقع؟',
        savePinAWS: 'حفظ بيانات التثبيت في AWS',
        toggleLang: 'English',
        xrTitle: 'إعدادات النموذج',
        xrScaleLabel: 'الحجم:',
        xrRotateLabel: 'الدوران:',
        xrStatus: 'النموذج مثبت - اضبط الإعدادات',
        xrSaveAWS: 'حفظ في AWS',
        xrReset: 'إعادة التثبيت',
        surfaceText: 'ابحث عن سطح',
        xrPinBtn: '📍 تثبيت الموقع',
        modalPinTitle: 'بيانات تثبيت موجودة',
        modalPinMessage: 'هذا النموذج يحتوي على بيانات تثبيت محفوظة. ماذا تريد أن تفعل؟',
        modalViewPin: '👁️ عرض بيانات التثبيت الحالية',
        modalOverwrite: '✏️ إنشاء بيانات تثبيت جديدة',
        alertTitle: 'تنبيه',
        alertOk: 'حسناً',
        webxrNotSupported: 'WebXR غير مدعوم على هذا الجهاز/المتصفح.',
        arSessionFailed: 'فشل بدء جلسة AR',
        noPinDataToSave: 'لا توجد بيانات تثبيت لحفظها'
      },
      en: {
        title: 'Pin the Model in AR',
        startAR: 'Start AR (WebXR)',
        statusReady: 'Ready. Requires Chrome on Android with WebXR.',
        statusLoaded: 'Model loaded. Tap Start AR.',
        statusLoading: 'Loading model...',
        statusError: 'Error: Please load a model from home page first',
        statusHasPinData: 'This model has saved pin data',
        statusNoPinData: 'Model not pinned yet - Start AR to add pin data',
        confirmOverwrite: 'This model has pin data. Do you want to overwrite it?\n\nChoose:\n- OK: Create new pin data\n- Cancel: View current data in showpin.html',
        loading: 'Loading content...',
        arOverlay: 'Model pinned! Save location?',
        savePinAWS: 'Save Pin Data to AWS',
        toggleLang: 'Arabic',
        xrTitle: 'Model Settings',
        xrScaleLabel: 'Scale:',
        xrRotateLabel: 'Rotate:',
        xrStatus: 'Model placed - adjust settings',
        xrSaveAWS: 'Save to AWS',
        xrReset: 'Reposition',
        surfaceText: 'Find a surface',
        xrPinBtn: '📍 Pin Location',
        modalPinTitle: 'Pin Data Found',
        modalPinMessage: 'This model has saved pin data. What would you like to do?',
        modalViewPin: '👁️ View Current Pin Data',
        modalOverwrite: '✏️ Create New Pin Data',
        alertTitle: 'Notice',
        alertOk: 'OK',
        webxrNotSupported: 'WebXR is not supported on this device/browser.',
        arSessionFailed: 'Failed to start AR session',
        noPinDataToSave: 'No pin data to save'
      }
    };

    function setLang(lang) {
      document.documentElement.lang = lang;
      document.body.setAttribute('lang', lang);
      const t = textContent[lang];
      title.textContent = t.title;
      startARBtn.textContent = t.startAR;
      document.getElementById('loading-screen').textContent = t.loading;
      document.getElementById('ar-overlay-text').textContent = t.arOverlay;
      document.getElementById('save-pin-aws').textContent = t.savePinAWS;
      langToggle.textContent = t.toggleLang;
      document.getElementById('xr-title').textContent = t.xrTitle;
      document.getElementById('xr-scale-label').textContent = t.xrScaleLabel;
      document.getElementById('xr-rotate-label').textContent = t.xrRotateLabel;
      document.getElementById('xr-status').textContent = t.xrStatus;
      document.getElementById('xr-save-aws').textContent = t.xrSaveAWS;
      document.getElementById('xr-reset').textContent = t.xrReset;
      document.getElementById('xr-pin-btn').textContent = t.xrPinBtn;
      document.getElementById('surface-text').textContent = t.surfaceText;
      document.getElementById('modal-title').textContent = t.modalPinTitle;
      document.getElementById('modal-message').textContent = t.modalPinMessage;
      document.getElementById('modal-view-pin').innerHTML = t.modalViewPin;
      document.getElementById('modal-overwrite').innerHTML = t.modalOverwrite;
      document.getElementById('alert-title').textContent = t.alertTitle;
      document.getElementById('alert-ok').textContent = t.alertOk;
    }

    const langToggle = document.getElementById('lang-toggle');
    const title = document.getElementById('title');
    const startARBtn = document.getElementById('start-ar');
    const status = document.getElementById('status');
    const loadingScreen = document.getElementById('loading-screen');
    
    const xrOverlay = document.getElementById('xr-overlay');
    const xrControls = document.getElementById('xr-controls');
    const xrSurfaceIndicator = document.getElementById('xr-surface-indicator');
    const xrScaleInput = document.getElementById('xr-scale');
    const xrScaleVal = document.getElementById('xr-scale-val');
    const xrRotateInput = document.getElementById('xr-rotate');
    const xrRotateVal = document.getElementById('xr-rotate-val');
    const xrSaveAWSBtn = document.getElementById('xr-save-aws');
    const xrPinBtn = document.getElementById('xr-pin-btn');
    const xrResetBtn = document.getElementById('xr-reset');
    
    const pinDataModal = document.getElementById('pin-data-modal');
    const modalViewPinBtn = document.getElementById('modal-view-pin');
    const modalOverwriteBtn = document.getElementById('modal-overwrite');
    const alertModal = document.getElementById('alert-modal');
    const alertMessage = document.getElementById('alert-message');
    const alertOkBtn = document.getElementById('alert-ok');

    // Modal helper functions
    function showPinDataModal() {
      return new Promise((resolve) => {
        pinDataModal.classList.add('show');
        
        const viewHandler = () => {
          pinDataModal.classList.remove('show');
          modalViewPinBtn.removeEventListener('click', viewHandler);
          modalOverwriteBtn.removeEventListener('click', overwriteHandler);
          resolve('view');
        };
        
        const overwriteHandler = () => {
          pinDataModal.classList.remove('show');
          modalViewPinBtn.removeEventListener('click', viewHandler);
          modalOverwriteBtn.removeEventListener('click', overwriteHandler);
          resolve('overwrite');
        };
        
        modalViewPinBtn.addEventListener('click', viewHandler);
        modalOverwriteBtn.addEventListener('click', overwriteHandler);
      });
    }
    
    function showAlert(message) {
      return new Promise((resolve) => {
        alertMessage.textContent = message;
        alertModal.classList.add('show');
        
        const okHandler = () => {
          alertModal.classList.remove('show');
          alertOkBtn.removeEventListener('click', okHandler);
          resolve();
        };
        
        alertOkBtn.addEventListener('click', okHandler);
      });
    }

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let loadedBytes = 0;

    // Toggle language
    langToggle.addEventListener('click', () => {
      const newLang = (document.documentElement.lang === 'ar') ? 'en' : 'ar';
      setLang(newLang);
    });

    // Show loading screen with progress
    function showLoadingScreen(show, totalBytes = 0) {
      loadingScreen.classList.toggle('hidden', !show);
      
      if (show && totalBytes > 0) {
        const updateProgress = () => {
          const currentLang = document.documentElement.lang;
          const baseText = textContent[currentLang].loading;
          loadingScreen.innerText = `${baseText} ${(loadedBytes / (1024 * 1024)).toFixed(2)} MB / ${(totalBytes / (1024 * 1024)).toFixed(2)} MB`;
          
          if (!loadingScreen.classList.contains('hidden')) {
            requestAnimationFrame(updateProgress);
          }
        };
        updateProgress();
      } else if (show) {
        loadingScreen.innerText = textContent[document.documentElement.lang].loading;
      }
    }

    // AWS configuration is loaded from aws-config.js
    const s3 = new AWS.S3();
    const bucketName = AWS_CONFIG.bucketName;

    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // Preview canvas setup
    const previewCanvas = document.getElementById('preview-canvas');
    const previewRenderer = new THREE.WebGLRenderer({ canvas: previewCanvas, antialias: true, alpha: true });
    previewRenderer.setSize(window.innerWidth, window.innerHeight);
    previewRenderer.setPixelRatio(window.devicePixelRatio);
    previewRenderer.shadowMap.enabled = true;
    previewRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    const previewScene = new THREE.Scene();
    previewScene.background = new THREE.Color(0x1a1a1a);
    
    const previewCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    previewCamera.position.set(0, 1.5, 3);
    
    const previewControls = new OrbitControls(previewCamera, previewCanvas);
    previewControls.enableDamping = true;
    previewControls.dampingFactor = 0.05;
    previewControls.minDistance = 0.5;
    previewControls.maxDistance = 50;
    previewControls.target.set(0, 0, 0);
    
    // Add multiple lights for better visibility
    const previewLight1 = new THREE.DirectionalLight(0xffffff, 2);
    previewLight1.position.set(5, 10, 7);
    previewScene.add(previewLight1);
    
    const previewLight2 = new THREE.DirectionalLight(0xffffff, 1);
    previewLight2.position.set(-5, 5, -7);
    previewScene.add(previewLight2);
    
    const previewLight3 = new THREE.AmbientLight(0xffffff, 1);
    previewScene.add(previewLight3);
    
    const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    previewScene.add(gridHelper);
    
    console.log('Preview scene setup complete');
    
    let previewModel = null;
    let isPreviewMode = true;
    
    function animatePreview() {
      if (isPreviewMode) {
        requestAnimationFrame(animatePreview);
        previewControls.update();
        previewRenderer.render(previewScene, previewCamera);
      }
    }
    
    // Start animation loop immediately
    animatePreview();
    console.log('Preview animation started');

    // Three.js setup for XR
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.xr.enabled = true;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.classList.add('xr');
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
    scene.add(hemi);

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x00ffaa })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let model = null;
    let modelKey = null;
    let currentModelKey = null;
    let placed = false;
    let xrSession = null;
    let xrRefSpace = null;
    let viewerSpace = null;
    let hitTestSource = null;
    let currentHitPose = null;
    let hasPinData = false;
    let originalFileName = '';
    let existingPinData = null;

    const loader = new GLTFLoader();

    function loadModelByPrefix(prefixVal) {
      return new Promise((resolve, reject) => {
        loadedBytes = 0;
        
        s3.listObjectsV2({ Bucket: bucketName, Prefix: prefixVal }, (err, data) => {
          if (err) {
            console.error('Error fetching bucket contents:', err);
            reject(err);
            return;
          }
          
          if (!data || !data.Contents || data.Contents.length === 0) {
            reject(new Error('No object found for prefix'));
            return;
          }
          
          const key = data.Contents[0].Key;
          console.log('Found model key:', key);
          const ext = key.split('.').pop().toLowerCase();
          
          // Check if model has pin data
          if (key.includes('_PINNED_')) {
            hasPinData = true;
            // Extract pin data and original filename
            const parts = key.split('_PINNED_');
            if (parts.length > 1) {
              const afterPinned = parts[1];
              const matches = afterPinned.match(/^([^_]+)_(.+)$/);
              if (matches) {
                const encodedData = matches[1];
                originalFileName = matches[2];
                console.log('Has pin data, original filename:', originalFileName);
                try {
                  existingPinData = JSON.parse(atob(encodedData));
                } catch (e) {
                  console.error('Failed to decode existing pin data:', e);
                }
              }
            }
          } else {
            hasPinData = false;
            // Extract original filename (remove 10-char prefix + underscore)
            const prefixLength = 11; // 10 chars prefix + 1 underscore
            originalFileName = key.substring(prefixLength);
            console.log('No pin data, original filename:', originalFileName);
          }
          
          if (ext !== 'glb' && ext !== 'gltf') {
            reject(new Error('Unsupported file type. Use glb/gltf'));
            return;
          }
          
          const params = { Bucket: bucketName, Key: key };
          
          // Get file metadata first for progress tracking
          s3.headObject(params, (err, metadata) => {
            if (err) {
              console.error('Error getting file metadata:', err);
              reject(err);
              return;
            }
            
            const totalBytes = metadata.ContentLength;
            showLoadingScreen(true, totalBytes);
            
            // Download with progress tracking
            s3.getObject(params)
              .on('httpDownloadProgress', (progress) => {
                loadedBytes = progress.loaded;
              })
              .send((err, data) => {
                if (err) {
                  console.error('Error loading object:', err);
                  showLoadingScreen(false);
                  reject(err);
                  return;
                }
                
                // Create URL from downloaded data
                const fileUrl = `https://${bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${key}`;
                console.log('Loading model from:', fileUrl);
                
                // Load the model using GLTFLoader
                loader.load(fileUrl, (gltf) => {
                  console.log('✓ Model loaded successfully');
                  model = gltf.scene;
                  model.visible = false;
                  model.scale.setScalar(1.0);
                  scene.add(model);
                  console.log('✓ Model added to XR scene');
                  
                  // Add to preview scene (deep clone for independent manipulation)
                  previewModel = gltf.scene.clone(true);
                  previewModel.scale.setScalar(1.0);
                  
                  let meshCount = 0;
                  // Ensure all meshes are visible and have materials
                  previewModel.traverse((child) => {
                    if (child.isMesh) {
                      meshCount++;
                      child.visible = true;
                      child.castShadow = true;
                      child.receiveShadow = true;
                      
                      // Clone or create material to avoid affecting XR model
                      if (!child.material) {
                        child.material = new THREE.MeshStandardMaterial({ 
                          color: 0xff6600,
                          metalness: 0.3,
                          roughness: 0.7,
                          wireframe: false,
                          side: THREE.DoubleSide
                        });
                      } else {
                        // Clone material to avoid affecting original
                        if (Array.isArray(child.material)) {
                          child.material = child.material.map(mat => {
                            const newMat = mat.clone();
                            newMat.side = THREE.DoubleSide;
                            newMat.transparent = false;
                            newMat.opacity = 1.0;
                            newMat.depthWrite = true;
                            newMat.depthTest = true;
                            newMat.needsUpdate = true;
                            // Add emissive to make it visible even without lights
                            if (newMat.emissive) newMat.emissive.setHex(0x333333);
                            return newMat;
                          });
                        } else {
                          const newMat = child.material.clone();
                          newMat.side = THREE.DoubleSide;
                          newMat.transparent = false;
                          newMat.opacity = 1.0;
                          newMat.depthWrite = true;
                          newMat.depthTest = true;
                          newMat.needsUpdate = true;
                          // Add emissive to make it visible even without lights
                          if (newMat.emissive) newMat.emissive.setHex(0x333333);
                          child.material = newMat;
                        }
                      }
                      
                      console.log('Mesh:', child.name || 'unnamed', 'Visible:', child.visible, 'Material:', child.material.type);
                    }
                  });
                  
                  console.log(`✓ Found ${meshCount} meshes in model`);
                  
                  previewScene.add(previewModel);
                  console.log('✓ Model added to preview scene');
                  
                  // Add wireframe clone for visibility debugging
                  const wireframeModel = previewModel.clone(true);
                  wireframeModel.traverse((child) => {
                    if (child.isMesh) {
                      child.material = new THREE.MeshBasicMaterial({ 
                        color: 0xffff00,
                        wireframe: true,
                        wireframeLinewidth: 2
                      });
                    }
                  });
                  previewScene.add(wireframeModel);
                  console.log('✓ Added wireframe clone');
                  
                  // Center model in preview
                  const box = new THREE.Box3().setFromObject(previewModel);
                  const center = box.getCenter(new THREE.Vector3());
                  const size = box.getSize(new THREE.Vector3());
                  
                  // Center both models
                  previewModel.position.x = -center.x;
                  previewModel.position.y = -center.y;
                  previewModel.position.z = -center.z;
                  
                  wireframeModel.position.x = -center.x;
                  wireframeModel.position.y = -center.y;
                  wireframeModel.position.z = -center.z;
                  
                  // Add a visible box helper to see the bounds
                  const boxHelper = new THREE.BoxHelper(previewModel, 0x00ff00);
                  previewScene.add(boxHelper);
                  console.log('✓ Added box helper for visibility');
                  
                  // Add axes helper at origin
                  const axesHelper = new THREE.AxesHelper(2);
                  previewScene.add(axesHelper);
                  console.log('✓ Added axes helper');
                  
                  // Adjust camera based on model size
                  const maxDim = Math.max(size.x, size.y, size.z);
                  const fov = previewCamera.fov * (Math.PI / 180);
                  let cameraZ = Math.abs(maxDim / Math.tan(fov / 2));
                  cameraZ *= 1.5; // Reduced multiplier for closer view
                  
                  previewCamera.position.set(cameraZ, cameraZ * 0.5, cameraZ);
                  previewCamera.lookAt(0, 0, 0);
                  previewControls.target.set(0, 0, 0);
                  previewControls.update();
                  
                  console.log('Model size:', size);
                  console.log('Model center:', center);
                  console.log('Camera position:', previewCamera.position);
                  console.log('Camera distance:', cameraZ);
                  console.log('Preview scene children:', previewScene.children.length);
                  console.log('✓ Setup complete - model should be visible now');
                  
                  modelKey = prefixVal;
                  currentModelKey = key;
                  showLoadingScreen(false);
                  resolve({ key, url: fileUrl });
                }, (progress) => {
                  // Loading progress
                  if (progress.lengthComputable) {
                    const percentComplete = (progress.loaded / progress.total) * 100;
                    console.log('GLTFLoader progress:', percentComplete.toFixed(2) + '%');
                  }
                }, (e) => {
                  console.error('Error loading GLTF:', e);
                  showLoadingScreen(false);
                  reject(e);
                });
              });
          });
        });
      });
    }

    // Auto-load model from URL parameter
    async function autoLoadModel() {
      const urlModelKey = getQueryParam('model');
      if (!urlModelKey || urlModelKey.length !== 10) {
        const currentLang = document.documentElement.lang;
        status.textContent = textContent[currentLang].statusError;
        status.style.color = '#f00';
        showLoadingScreen(false);
        return;
      }

      // Always load from AWS
      status.textContent = textContent[document.documentElement.lang].statusLoading;
      showLoadingScreen(true);
      try {
        await loadModelByPrefix(urlModelKey);
        const currentLang = document.documentElement.lang;
        
        if (hasPinData) {
          status.textContent = textContent[currentLang].statusHasPinData;
          status.style.color = '#ffc107';
          
          // Show modal instead of confirm
          const decision = await showPinDataModal();
          if (decision === 'view') {
            // Redirect to showpin.html
            window.location.href = `showpin.html?model=${urlModelKey}`;
            return;
          }
          // If 'overwrite', continue to allow AR session
        } else {
          status.textContent = textContent[currentLang].statusNoPinData;
          status.style.color = '#0f0';
        }
        
        startARBtn.disabled = false;
      } catch (e) {
        console.error('Error loading model:', e);
        const currentLang = document.documentElement.lang;
        status.textContent = `${textContent[currentLang].statusError}: ${e.message}`;
        status.style.color = '#f00';
        showLoadingScreen(false);
      }
    }

    async function startAR() {
      if (!navigator.xr) {
        const currentLang = document.documentElement.lang;
        await showAlert(textContent[currentLang].webxrNotSupported);
        return;
      }
      try {
        // Stop preview mode
        isPreviewMode = false;
        previewCanvas.classList.add('hidden');
        renderer.domElement.classList.add('active');
        
        xrSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor'],
          optionalFeatures: ['anchors', 'dom-overlay'],
          domOverlay: { root: xrOverlay }
        });
        renderer.xr.setSession(xrSession);
        xrRefSpace = await xrSession.requestReferenceSpace('local-floor');
        viewerSpace = await xrSession.requestReferenceSpace('viewer');
        const hitSource = await xrSession.requestHitTestSource({ space: viewerSpace });
        hitTestSource = hitSource;

        // Hide main UI and show XR overlay
        document.getElementById('ui').style.display = 'none';
        document.getElementById('lang-toggle').style.display = 'none';
        xrSurfaceIndicator.style.display = 'block';
        
        xrSession.addEventListener('end', () => {
          xrSession = null; hitTestSource = null; placed = false; reticle.visible = false;
          document.getElementById('ar-overlay').style.display = 'none';
          xrControls.style.display = 'none';
          xrSurfaceIndicator.style.display = 'none';
          document.getElementById('ui').style.display = 'block';
          document.getElementById('lang-toggle').style.display = 'block';
          
          // Return to preview mode
          isPreviewMode = true;
          previewCanvas.classList.remove('hidden');
          renderer.domElement.classList.remove('active');
          animatePreview();
          
          status.textContent = textContent[document.documentElement.lang].statusReady;
        });

        status.textContent = textContent[document.documentElement.lang].statusAR;
        renderer.setAnimationLoop(onXRFrame);
      } catch (e) {
        console.error(e);
        const currentLang = document.documentElement.lang;
        await showAlert(`${textContent[currentLang].arSessionFailed}: ${e.message}`);
      }
    }

    function onXRFrame(time, frame) {
      const session = renderer.xr.getSession();
      if (!session || !hitTestSource) return;
      const pose = frame.getViewerPose(xrRefSpace);
      if (!pose) return;

      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0) {
        const hit = results[0];
        const hitPose = hit.getPose(xrRefSpace);
        currentHitPose = hitPose;
        reticle.visible = true;
        reticle.matrix.fromArray(hitPose.transform.matrix);
      } else {
        reticle.visible = false;
      }

      renderer.render(scene, camera);
    }
function placeModel() {
      if (!currentHitPose || !model) return;
      // Place model at reticle
      const m = new THREE.Matrix4().fromArray(currentHitPose.transform.matrix);
      const pos = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scl = new THREE.Vector3();
      m.decompose(pos, quat, scl);

      model.position.copy(pos);
      model.quaternion.copy(quat);
      model.visible = true;
      placed = true;
      
      // Hide surface indicator and show controls
      xrSurfaceIndicator.style.display = 'none';
      xrControls.style.display = 'block';
      
      // Sync scale with XR controls
      xrScaleInput.value = model.scale.x;
      xrScaleVal.textContent = `${model.scale.x.toFixed(2)}×`;

      // Try anchors API if available
      const session = renderer.xr.getSession();
      const frame = session?.requestAnimationFrame ? null : null; // placeholder; anchors handled via result.createAnchor when available
      // Some runtimes expose createAnchor on hit test result; keep best-effort approach
      // We still keep the transform in our own scene for persistence in this session.
    }

    startARBtn.addEventListener('click', startAR);
    xrPinBtn.addEventListener('click', placeModel);

    // XR Scale control
    xrScaleInput.addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      xrScaleVal.textContent = `${s.toFixed(2)}×`;
      if (model && placed) {
        model.scale.setScalar(s);
      }
    });
    
    // XR Rotate control
    xrRotateInput.addEventListener('input', (e) => {
      const deg = parseFloat(e.target.value);
      xrRotateVal.textContent = `${deg}°`;
      if (model && placed) {
        model.rotation.y = (deg * Math.PI) / 180;
      }
    });
    
    // XR Reset button
    xrResetBtn.addEventListener('click', () => {
      if (model) {
        model.visible = false;
        placed = false;
        xrControls.style.dtruay = 'none';
        xrSurfaceIndicator.style.display = 'block';
        reticle.visible = false;
      }
    });
    
    // XR Save to AWS button
    xrSaveAWSBtn.addEventListener('click', async () => {
      if (!model || !placed || !modelKey || !currentModelKey) {
        const currentLang = document.documentElement.lang;
        await showAlert(textContent[currentLang].noPinDataToSave);
        return;
      }

      const pinData = {
        position: { x: model.position.x, y: model.position.y, z: model.position.z },
        quaternion: { x: model.quaternion.x, y: model.quaternion.y, z: model.quaternion.z, w: model.quaternion.w },
        scale: { x: model.scale.x, y: model.scale.y, z: model.scale.z },
        rotation: { y: model.rotation.y }
      };

      const pinDataString = JSON.stringify(pinData);
      const encodedPinData = btoa(pinDataString);
      
      // Create new key with PINNED identifier and preserve original filename
      // Format: {prefix}_PINNED_{encodedData}_{originalFileName}
      const newKey = `${modelKey}_PINNED_${encodedPinData}_${originalFileName}`;

      try {
        const currentLang = document.documentElement.lang;
        document.getElementById('xr-status').textContent = currentLang === 'ar' ? 'جار الحفظ...' : 'Saving...';
        
        await s3.copyObject({
          Bucket: bucketName,
          CopySource: `${bucketName}/${currentModelKey}`,
          Key: newKey
        }).promise();

        await s3.deleteObject({
          Bucket: bucketName,
          Key: currentModelKey
        }).promise();

        currentModelKey = newKey;
        const msg = currentLang === 'ar' ? 'تم الحفظ بنجاح!' : 'Saved successfully!';
        document.getElementById('xr-status').textContent = msg;
        document.getElementById('xr-status').style.color = '#0f0';
        
        setTimeout(() => {
          if (xrSession) xrSession.end();
        }, 2000);
      } catch (e) {
        console.error('Error saving pin data to AWS:', e);
        const currentLang = document.documentElement.lang;
        const msg = currentLang === 'ar' ? 'فشل الحفظ: ' + e.message : 'Save failed: ' + e.message;
        document.getElementById('xr-status').textContent = msg;
        document.getElementById('xr-status').style.color = '#f00';
      }
    });

    window.addEventListener('resize', () => {
      // Update preview renderer
      previewRenderer.setSize(window.innerWidth, window.innerHeight);
      previewCamera.aspect = window.innerWidth / window.innerHeight;
      previewCamera.updateProjectionMatrix();
      
      // Update XR renderer
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // Initialize Arabic as default and auto-load model
    setLang('ar');
    autoLoadModel();
  </script>
</body>
</html>
