<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Babylon.js WebXR AR: Dummy3</title>

        <style>
            html, body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
            #renderCanvas {
                width: 100%;
                height: 100%;
                touch-action: none;
                outline: none;
            }
        </style>

        <script src="https://cdn.babylonjs.com/babylon.js"></script>
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    </head>

   <body>
    <canvas id="renderCanvas"></canvas>
    
    <script>
        // === INITIALIZATION PHASE ===
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // === SCENE CREATION LOGIC ===
        const createScene = async function () {
            
            // 1. Basic Scene Setup
            const scene = new BABYLON.Scene(engine);
            
            // Non-AR Camera (for testing on PC)
            const camera = new BABYLON.ArcRotateCamera("camera1", Math.PI / 2, Math.PI / 2.5, 5, new BABYLON.Vector3(0, 1, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;

            // 2. Lighting for AR
            // Ambient light
            const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            // Directional light for shadows
            var dirLight = new BABYLON.DirectionalLight('dirlight', new BABYLON.Vector3(0, -1, -0.5), scene);
            dirLight.position = new BABYLON.Vector3(0, 5, -5);

            // Shadow Generator
            var shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            // 3. UI Setup (Instructions)
            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("FullscreenUI");
            const rectangle = new BABYLON.GUI.Rectangle("rect");
            rectangle.background = "black";
            rectangle.color = "blue";
            rectangle.width = "80%";
            rectangle.height = "20%";
            rectangle.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
            rectangle.top = "20px";
            advancedTexture.addControl(rectangle);

            const text1 = new BABYLON.GUI.TextBlock("text1");
            text1.text = "Initializing AR...";
            text1.color = "white";
            text1.fontSize = "14px";
            text1.textWrapping = true;
            rectangle.addControl(text1);

            // 4. Asset Loading
            const dummy3URL = "https://playground.babylonjs.com/scenes/dummy3.babylon";
            console.log("Status: Starting Asset Load");

            const result = await BABYLON.SceneLoader.ImportMeshAsync("", dummy3URL, "", scene);
            
            // Prepare the mesh
            let originalMesh = result.meshes[0];
            originalMesh.rotationQuaternion = new BABYLON.Quaternion();
            originalMesh.isVisible = false; // Hide original, we will clone it on tap

            // Prepare the skeleton and animation
            let skeleton = result.skeletons[0];
            if(skeleton) {
                skeleton.animationPropertiesOverride = new BABYLON.AnimationPropertiesOverride();
                skeleton.animationPropertiesOverride.enableBlending = true;
                skeleton.animationPropertiesOverride.blendingSpeed = 0.05;
                skeleton.animationPropertiesOverride.loopMode = 1;
            }
            
            // 5. Create the Target Marker (The ring on the floor)
            const marker = BABYLON.MeshBuilder.CreateTorus('marker', { diameter: 0.15, thickness: 0.05 });
            marker.isVisible = false;
            marker.rotationQuaternion = new BABYLON.Quaternion();
            const markerMat = new BABYLON.StandardMaterial("markerMat", scene);
            markerMat.emissiveColor = new BABYLON.Color3(1, 0, 0); // Red glow
            marker.material = markerMat;

            // 6. WebXR Configuration
            // Check if AR is supported
            const arAvailable = await BABYLON.WebXRSessionManager.IsSessionSupportedAsync('immersive-ar');

            if (!arAvailable) {
                text1.text = "AR is not available on this device. Please use a mobile phone with ARCore/ARKit.";
                return scene;
            }

            text1.text = "AR Ready! Click the Goggles button at bottom-right.\nOnce in AR, look at the floor to find a surface, then TAP to place the robot.";

            // Initialize XR with AR options
            const xr = await scene.createDefaultXRExperienceAsync({
                uiOptions: {
                    sessionMode: 'immersive-ar', // KEY: This enables AR instead of VR
                },
                optionalFeatures: true // Enable all optional features like hit-test
            });

            // 7. AR Features Manager
            const fm = xr.baseExperience.featuresManager;
            
            // Enable Hit Test (detecting floor)
            const xrTest = fm.enableFeature(BABYLON.WebXRHitTest.Name, "latest");
            
            // Enable Anchors (keeping object in place)
            const anchors = fm.enableFeature(BABYLON.WebXRAnchorSystem.Name, 'latest');
            
            // Enable Background Remover (so you see the camera feed)
            // Note: createDefaultXRExperienceAsync usually does this automatically for AR, but we ensure it here
            // const bgRemover = fm.enableFeature(BABYLON.WebXRBackgroundRemover.Name);

            // Hide UI when in AR
            xr.baseExperience.sessionManager.onXRSessionInit.add(() => {
                rectangle.isVisible = false;
            });
            xr.baseExperience.sessionManager.onXRSessionEnded.add(() => {
                rectangle.isVisible = true;
            });

            // 8. Hit Testing Logic
            let hitTest;

            xrTest.onHitTestResultObservable.add((results) => {
                if (results.length) {
                    marker.isVisible = true;
                    hitTest = results[0];
                    // Update marker position/rotation to match the floor surface
                    hitTest.transformationMatrix.decompose(undefined, marker.rotationQuaternion, marker.position);
                } else {
                    marker.isVisible = false;
                    hitTest = undefined;
                }
            });

            // 9. Anchor Logic (Placing the object)
            if (anchors) {
                anchors.onAnchorAddedObservable.add(anchor => {
                    // Clone the mesh at the anchor point
                    anchor.attachedNode = originalMesh.clone("clone");
                    anchor.attachedNode.isVisible = true;
                    
                    // Clone skeleton if it exists to enable animation on the new mesh
                    if (skeleton) {
                         anchor.attachedNode.skeleton = skeleton.clone('cloneSkeleton');
                         // Play animation on the new skeleton
                         scene.beginAnimation(anchor.attachedNode.skeleton, 0, 100, true);
                    }
                    
                    shadowGenerator.addShadowCaster(anchor.attachedNode, true);
                });
            }

            // 10. Input Handling (Tap to Place)
            scene.onPointerDown = (evt, pickInfo) => {
                if (hitTest && anchors && xr.baseExperience.state === BABYLON.WebXRState.IN_XR) {
                    anchors.addAnchorPointUsingHitTestResultAsync(hitTest);
                }
            };

            return scene;
        };

        // === EXECUTION PHASE ===
        createScene().then((scene) => {
            engine.runRenderLoop(function () {
                if (scene) {
                    scene.render();
                }
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
   </body>
</html>
