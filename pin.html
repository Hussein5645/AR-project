<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pin AR Model (WebXR)</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
  <script src="aws-config.js"></script>
  <script type="module" src="lib/mindar/mindar-image.prod.js"></script>
  <style>
    body[lang="ar"] { direction: rtl; }
    body[lang="en"] { direction: ltr; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; }
    #ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); padding: 12px; border-radius: 8px; width: calc(100% - 20px); max-width: 520px; z-index: 10; pointer-events: auto; }
    #ui h2 { margin: 0 0 8px 0; font-size: 18px; }
    #ui .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #ui input[type="text"], #ui input[type="range"] { flex: 1; padding: 8px; border: none; border-radius: 6px; background: #2a2a2a; color: #fff; }
    #ui input[type="text"]::placeholder { color: #bbb; }
    #ui button { padding: 10px 14px; border: none; border-radius: 6px; background: #007bff; color: #fff; font-weight: bold; cursor: pointer; pointer-events: auto; }
    #ui button.secondary { background: #444; }
    #ui button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { font-size: 12px; color: #bbb; margin-top: 4px; }
    #lang-toggle { position: fixed; top: 10px; right: 10px; z-index: 11; padding: 8px 12px; border-radius: 6px; background: #444; color: #fff; cursor: pointer; pointer-events: auto; }
    #preview-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 1; }
    #preview-canvas.hidden { display: none; }
    canvas.xr { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; z-index: 1; }
    canvas.xr.active { display: block; }
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; color: #fff; font-size: 1.5em; z-index: 20; transition: opacity 0.5s ease; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #ar-overlay { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px; display: none; z-index: 25; min-width: 280px; text-align: center; }
    #ar-overlay button { width: 100%; margin: 5px 0; padding: 12px; border: none; border-radius: 6px; background: #28a745; color: #fff; font-weight: bold; cursor: pointer; }
    #ar-overlay button:hover { background: #218838; }
    #ar-overlay p { margin: 5px 0; font-size: 14px; color: #bbb; }
    
    #xr-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
    #xr-overlay > * { pointer-events: auto; }
    #xr-controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 12px; display: none; min-width: 320px; }
    body[lang="ar"] #xr-controls { direction: rtl; }
    body[lang="en"] #xr-controls { direction: ltr; }
    #xr-controls h3 { margin: 0 0 15px 0; font-size: 16px; color: #fff; text-align: center; }
    #xr-controls .control-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    #xr-controls label { color: #fff; font-size: 14px; min-width: 60px; }
    #xr-controls input[type="range"] { flex: 1; }
    #xr-controls .value-display { color: #0f0; font-weight: bold; min-width: 60px; text-align: center; }
    #xr-controls button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 14px; }
    #xr-controls .btn-primary { background: #28a745; color: #fff; }
    #xr-controls .btn-primary:hover { background: #218838; }
    #xr-controls .btn-secondary { background: #6c757d; color: #fff; }
    #xr-controls .btn-secondary:hover { background: #5a6268; }
    #xr-controls .status-text { color: #ffc107; font-size: 13px; text-align: center; margin: 10px 0; }
    #xr-surface-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffaa; font-size: 18px; text-align: center; display: none; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
    #xr-surface-indicator .icon { font-size: 48px; margin-bottom: 10px; }
    #xr-pin-btn { padding: 16px 32px; border: none; border-radius: 50px; background: #00ffaa; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,255,170,0.4); transition: all 0.3s; }
    #xr-pin-btn:hover { background: #00dd88; transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,255,170,0.6); }
    #xr-pin-btn:active { transform: scale(0.95); }
    /* Image tracking indicator */
    #xr-image-indicator { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 8px; display: none; min-width: 260px; text-align: center; z-index: 26; }
    #xr-image-indicator .icon { font-size: 28px; margin-bottom: 6px; }
    #xr-image-indicator .status { font-size: 14px; color: #bbb; }
    #xr-image-indicator.scanning { box-shadow: 0 0 12px rgba(0,255,170,0.35); border: 1px solid rgba(0,255,170,0.35); }
    #xr-image-indicator.scanning::after { content: ''; display: block; width: 26px; height: 26px; border: 3px solid #00ffaa; border-right-color: transparent; border-radius: 50%; margin: 10px auto 0; animation: spin 1s linear infinite; }
    #xr-image-indicator.found { border: 2px solid #00ffaa; box-shadow: 0 0 20px rgba(0,255,170,0.6); background: rgba(0,0,0,0.9); }
    #xr-image-indicator.found .status { font-size: 14px; color: #00ffaa; font-weight: bold; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    /* Anchor scan visual (screen-center dots) */
    #anchor-scan-visual { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 180px; height: 180px; pointer-events: none; display: none; z-index: 27; }
    #anchor-scan-visual .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(0,255,170,0.4); animation: ring-pulse 2s ease-in-out infinite; }
    #anchor-scan-visual .ring:nth-child(2) { animation-delay: 0.3s; opacity: 0.6; }
    #anchor-scan-visual .ring:nth-child(3) { animation-delay: 0.6s; opacity: 0.35; }
    #anchor-scan-visual .dot { position: absolute; width: 10px; height: 10px; background: #00ffaa; border-radius: 50%; top: 50%; left: 50%; transform-origin: -70px 0; animation: orbit 1.2s linear infinite; box-shadow: 0 0 8px rgba(0,255,170,0.6); }
    #anchor-scan-visual .dot:nth-child(4) { animation-delay: 0.15s; }
    #anchor-scan-visual .dot:nth-child(5) { animation-delay: 0.3s; }
    #anchor-scan-visual .dot:nth-child(6) { animation-delay: 0.45s; }
    #anchor-scan-visual .dot:nth-child(7) { animation-delay: 0.6s; }
    #anchor-scan-visual .dot:nth-child(8) { animation-delay: 0.75s; }
    @keyframes ring-pulse {
      0% { transform: scale(0.75); opacity: 0.5; }
      50% { transform: scale(1); opacity: 0.35; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(70px); }
      to { transform: rotate(360deg) translateX(70px); }
    }
    
    /* Modal Dialogs */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.show { display: flex; }
    .modal-content { background: #1e1e1e; border-radius: 12px; padding: 30px; max-width: 400px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    body[lang="ar"] .modal-content { direction: rtl; text-align: right; }
    body[lang="en"] .modal-content { direction: ltr; text-align: left; }
    .modal-content h3 { margin: 0 0 15px 0; color: #fff; font-size: 20px; }
    .modal-content p { margin: 0 0 25px 0; color: #bbb; font-size: 15px; line-height: 1.6; }
    .modal-content .icon-warning { font-size: 48px; text-align: center; margin-bottom: 15px; }
    .modal-buttons { display: flex; gap: 10px; flex-direction: column; }
    .modal-buttons button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all 0.2s; }
    .modal-buttons .btn-primary { background: #28a745; color: #fff; }
    .modal-buttons .btn-primary:hover { background: #218838; transform: translateY(-2px); }
    .modal-buttons .btn-info { background: #17a2b8; color: #fff; }
    .modal-buttons .btn-info:hover { background: #138496; transform: translateY(-2px); }
    .modal-buttons .btn-danger { background: #dc3545; color: #fff; }
    .modal-buttons .btn-danger:hover { background: #c82333; }
    .modal-buttons .btn-secondary { background: #6c757d; color: #fff; }
    .modal-buttons .btn-secondary:hover { background: #5a6268; }

    /* Force MindAR video/canvas to fill the viewport in portrait */
    .mindar-video, .mindar-canvas { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; object-fit: cover !important; }
    .mindar-canvas { z-index: 1 !important; }
    .mindar-video { z-index: 0 !important; }
  </style>
</head>
<body lang="ar">

  <script type="importmap">
    {

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        noPinDataToSave: 'لا توجد بيانات تثبيت لحفظها',
        anchorScan: 'اختر مرساة من السطح',
        anchorLocked: 'تم تحديد المرساة - يمكنك التثبيت الآن',
        anchorRequired: 'يجب اختيار مرساة قبل المتابعة',
        anchorSavingGuard: 'يرجى اختيار المرساة قبل الحفظ',
        anchorShowPrompt: 'اختر مرساة لعرض الموقع',
        rescanForSave: 'امسح المرساة مرة أخرى لتثبيت موضع المجسم'
      },
      en: {
        title: 'Pin the Model in AR',
        showPinBtn: '👁️ View Pin Data',
        editPinBtn: '✏️ Edit Pin Data',
        statusAR: 'Starting AR session... ',
        statusReady: 'Ready. Requires Chrome on Android with WebXR.',
        statusLoaded: 'Model loaded. Tap Start AR.',
        statusLoading: 'Loading model...',
        statusError: 'Error: Please load a model from home page first',
        statusHasPinData: 'This model has saved pin data',
        statusNoPinData: 'Model not pinned yet - Start AR to add pin data',
        confirmOverwrite: 'This model has pin data. Do you want to overwrite it?\n\nChoose:\n- OK: Create new pin data\n- Cancel: View current data in showpin.html',
        loading: 'Loading content...',
        arOverlay: 'Model pinned! Save location?',
        savePinAWS: 'Save Pin Data to AWS',
        toggleLang: 'Arabic',
        xrTitle: 'Model Settings',
        xrScaleLabel: 'Scale:',
        xrRotateLabel: 'Rotate:',
        xrStatus: 'Model placed - adjust settings',
        xrSaveAWS: 'Save to AWS',
        xrReset: 'Reposition',
        surfaceText: 'Find a surface',
        xrPinBtn: '📍 Pin Location',
        alertTitle: 'Notice',
        alertOk: 'OK',
        webxrNotSupported: 'WebXR is not supported on this device/browser.',
        arSessionFailed: 'Failed to start AR session',
        noPinDataToSave: 'No pin data to save',
        anchorScan: 'Tap a surface to pick an anchor',
        anchorLocked: 'Anchor set - you can place now',
        anchorRequired: 'You must select an anchor before continuing',
        anchorSavingGuard: 'Please select the anchor before saving',
        anchorShowPrompt: 'Select an anchor to show the pin',
        rescanForSave: 'Rescan the anchor to lock the object position'
      }
    };

    function setLang(lang) {
      document.documentElement.lang = lang;
      document.body.setAttribute('lang', lang);
      const t = textContent[lang];
      title.textContent = t.title;
      btnShowPin.textContent = t.showPinBtn;
      btnEditPin.textContent = t.editPinBtn;
      document.getElementById('loading-screen').textContent = t.loading;
      document.getElementById('ar-overlay-text').textContent = t.arOverlay;
      document.getElementById('save-pin-aws').textContent = t.savePinAWS;
      langToggle.textContent = t.toggleLang;
      document.getElementById('xr-title').textContent = t.xrTitle;
      document.getElementById('xr-scale-label').textContent = t.xrScaleLabel;
      document.getElementById('xr-rotate-label').textContent = t.xrRotateLabel;
      document.getElementById('xr-status').textContent = t.xrStatus;
      document.getElementById('xr-save-aws').textContent = t.xrSaveAWS;
      document.getElementById('xr-reset').textContent = t.xrReset;
      document.getElementById('xr-pin-btn').textContent = t.xrPinBtn;
      document.getElementById('surface-text').textContent = t.surfaceText;
      document.getElementById('alert-title').textContent = t.alertTitle;
      document.getElementById('alert-ok').textContent = t.alertOk;
    }

    const langToggle = document.getElementById('lang-toggle');
    const title = document.getElementById('title');
    const btnShowPin = document.getElementById('btn-show-pin');
    const btnEditPin = document.getElementById('btn-edit-pin');
    const status = document.getElementById('status');
    const loadingScreen = document.getElementById('loading-screen');
    
    const xrOverlay = document.getElementById('xr-overlay');
    const xrControls = document.getElementById('xr-controls');
    const xrSurfaceIndicator = document.getElementById('xr-surface-indicator');
    const surfaceTextEl = document.getElementById('surface-text');
    const xrImageIndicator = document.getElementById('xr-image-indicator');
    const imageTextEl = document.getElementById('image-text');
    const anchorScanVisual = document.getElementById('anchor-scan-visual');
    const xrScaleInput = document.getElementById('xr-scale');
    const xrScaleVal = document.getElementById('xr-scale-val');
    const xrRotateInput = document.getElementById('xr-rotate');
    const xrRotateVal = document.getElementById('xr-rotate-val');
    const xrSaveAWSBtn = document.getElementById('xr-save-aws');
    const xrPinBtn = document.getElementById('xr-pin-btn');
    const xrResetBtn = document.getElementById('xr-reset');
    
    const alertModal = document.getElementById('alert-modal');
    const alertMessage = document.getElementById('alert-message');
    const alertOkBtn = document.getElementById('alert-ok');

    // Decision modal removed
    
    function showAlert(message) {
      return new Promise((resolve) => {
        alertMessage.textContent = message;
        alertModal.classList.add('show');
        
        const okHandler = () => {
          alertModal.classList.remove('show');
          alertOkBtn.removeEventListener('click', okHandler);
          resolve();
        };
        
        alertOkBtn.addEventListener('click', okHandler);
      });
    }

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let loadedBytes = 0;

    // Toggle language
    langToggle.addEventListener('click', () => {
      const newLang = (document.documentElement.lang === 'ar') ? 'en' : 'ar';
      setLang(newLang);
    });

    // Show loading screen with progress
    function showLoadingScreen(show, totalBytes = 0) {
      loadingScreen.classList.toggle('hidden', !show);
      
      if (show && totalBytes > 0) {
        const updateProgress = () => {
          const currentLang = document.documentElement.lang;
          const baseText = textContent[currentLang].loading;
          loadingScreen.innerText = `${baseText} ${(loadedBytes / (1024 * 1024)).toFixed(2)} MB / ${(totalBytes / (1024 * 1024)).toFixed(2)} MB`;
          
          if (!loadingScreen.classList.contains('hidden')) {
            requestAnimationFrame(updateProgress);
          }
        };
        updateProgress();
      } else if (show) {
        loadingScreen.innerText = textContent[document.documentElement.lang].loading;
      }
    }

    // AWS configuration is loaded from aws-config.js
    const s3 = new AWS.S3();
    const bucketName = AWS_CONFIG.bucketName;

    function decodePinData(encoded) {
      if (!encoded) return null;
      try {
        let clean = encoded.trim().replace(/\s+/g, '');
        clean = clean.replace(/\./g, '+');
        let b64 = clean.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4;
        if (pad) b64 += '='.repeat(4 - pad);
        const jsonStr = atob(b64);
        return JSON.parse(jsonStr);
      } catch (e1) {
        try {
          const jsonStr = decodeURIComponent(encoded);
          return JSON.parse(jsonStr);
        } catch (e2) {
          console.error('Pin data decode failed:', { e1, e2 });
          return null;
        }
      }
    }

    function extractPinDataFromKey(key) {
      const m = key.match(/_PINNED_([A-Za-z0-9\-_=]+)(?:_|\.|$)/);
      if (m && m[1]) {
        return decodePinData(m[1]);
      }
      return null;
    }

    function hasPinnedAfterPrefix(key, prefixLen = 10) {
      const idx = key.toLowerCase().indexOf('_pinned_');
      // يجب أن تبدأ "_pinned_" مباشرة بعد أول 10 محارف (أي عند الفهرس 10)
      return idx >= prefixLen;
    }

    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function loadModelByPrefix(prefixVal) {
      return new Promise((resolve, reject) => {
        loadedBytes = 0;
        
        s3.listObjectsV2({ Bucket: bucketName, Prefix: prefixVal }, (err, data) => {
          if (err) {
            console.error('Error fetching bucket contents:', err);
            reject(err);
            return;
          }
          
          if (!data || !data.Contents || data.Contents.length === 0) {
            reject(new Error('No object found for prefix'));
            return;
          }
          
          const key = data.Contents[0].Key;
          console.log('Found model key:', key);
          const ext = key.split('.').pop().toLowerCase();
          
          // Check if model has pin data
          if (key.includes('_PINNED_')) {
            hasPinData = true;
            // Extract pin data and original filename
            const parts = key.split('_PINNED_');
            if (parts.length > 1) {
              const afterPinned = parts[1];
              const matches = afterPinned.match(/^([^_]+)_(.+)$/);
              if (matches) {
                const encodedData = matches[1];
                originalFileName = matches[2];
                console.log('Has pin data, original filename:', originalFileName);
                existingPinData = decodePinData(encodedData);
              }
            }
          } else {
            hasPinData = false;
            // Extract original filename (remove 10-char prefix + underscore)
            const prefixLength = 11; // 10 chars prefix + 1 underscore
            originalFileName = key.substring(prefixLength);
            console.log('No pin data, original filename:', originalFileName);
          }
          
          if (ext !== 'glb' && ext !== 'gltf') {
            reject(new Error('Unsupported file type. Use glb/gltf'));
            return;
          }
          
          const params = { Bucket: bucketName, Key: key };
          
          // Get file metadata first for progress tracking
          s3.headObject(params, (err, metadata) => {
            if (err) {
              console.error('Error getting file metadata:', err);
              reject(err);
              return;
            }
            
            const totalBytes = metadata.ContentLength;
            showLoadingScreen(true, totalBytes);
            
            // Download with progress tracking
            s3.getObject(params)
              .on('httpDownloadProgress', (progress) => {
                loadedBytes = progress.loaded;
              })
              .send((err, data) => {
                if (err) {
                  console.error('Error loading object:', err);
                  showLoadingScreen(false);
                  reject(err);
                  return;
                }
                
                // Create URL from downloaded data
                const fileUrl = `https://${bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${key}`;
                console.log('Loading model from:', fileUrl);
                
                // Load the model using GLTFLoader
                loader.load(fileUrl, (gltf) => {
                  console.log('✓ Model loaded successfully');
                  model = gltf.scene;
                  model.visible = false;
                  model.scale.setScalar(1.0);
                  scene.add(model);
                  console.log('✓ Model added to XR scene');
                  
                  // Add to preview scene (deep clone for independent manipulation)
                  previewModel = gltf.scene.clone(true);
                  previewModel.scale.setScalar(1.0);
                  
                  let meshCount = 0;
                  // Ensure all meshes are visible and have materials
                  previewModel.traverse((child) => {
                    if (child.isMesh) {
                      meshCount++;
                      child.visible = true;
                      child.castShadow = true;
                      child.receiveShadow = true;
                      
                      // Clone or create material to avoid affecting XR model
                      if (!child.material) {
                        child.material = new THREE.MeshStandardMaterial({ 
                          color: 0xff6600,
                          metalness: 0.3,
                          roughness: 0.7,
                          wireframe: false,
                          side: THREE.DoubleSide
                        });
                      } else {
                        // Clone material to avoid affecting original
                        if (Array.isArray(child.material)) {
                          child.material = child.material.map(mat => {
                            const newMat = mat.clone();
                            newMat.side = THREE.DoubleSide;
                            newMat.transparent = false;
                            newMat.opacity = 1.0;
                            newMat.depthWrite = true;
                            newMat.depthTest = true;
                            newMat.needsUpdate = true;
                            // Add emissive to make it visible even without lights
                            if (newMat.emissive) newMat.emissive.setHex(0x333333);
                            return newMat;
                          });
                        } else {
                          const newMat = child.material.clone();
                          newMat.side = THREE.DoubleSide;
                          newMat.transparent = false;
                          newMat.opacity = 1.0;
                          newMat.depthWrite = true;
                          newMat.depthTest = true;
                          newMat.needsUpdate = true;
                          // Add emissive to make it visible even without lights
                          if (newMat.emissive) newMat.emissive.setHex(0x333333);
                          child.material = newMat;
                        }
                      }
                      
                      console.log('Mesh:', child.name || 'unnamed', 'Visible:', child.visible, 'Material:', child.material.type);
                    }
                  });
                  
                  console.log(`✓ Found ${meshCount} meshes in model`);
                  
                  previewScene.add(previewModel);
                  console.log('✓ Model added to preview scene');
                  
                  // Add wireframe clone for visibility debugging
                  const wireframeModel = previewModel.clone(true);
                  wireframeModel.traverse((child) => {
                    if (child.isMesh) {
                      child.material = new THREE.MeshBasicMaterial({ 
                        color: 0xffff00,
                        wireframe: true,
                        wireframeLinewidth: 2
                      });
                    }
                  });
                  previewScene.add(wireframeModel);
                  console.log('✓ Added wireframe clone');
                  
                  // Center model in preview
                  const box = new THREE.Box3().setFromObject(previewModel);
                  const center = box.getCenter(new THREE.Vector3());
                  const size = box.getSize(new THREE.Vector3());
                  
                  // Center both models
                  previewModel.position.x = -center.x;
                  previewModel.position.y = -center.y;
                  previewModel.position.z = -center.z;
                  
                  wireframeModel.position.x = -center.x;
                  wireframeModel.position.y = -center.y;
                  wireframeModel.position.z = -center.z;
                  
                  // Add a visible box helper to see the bounds
                  const boxHelper = new THREE.BoxHelper(previewModel, 0x00ff00);
                  previewScene.add(boxHelper);
                  console.log('✓ Added box helper for visibility');
                  
                  // Add axes helper at origin
                  const axesHelper = new THREE.AxesHelper(2);
                  previewScene.add(axesHelper);
                  console.log('✓ Added axes helper');
                  
                  // Adjust camera based on model size
                  const maxDim = Math.max(size.x, size.y, size.z);
                  const fov = previewCamera.fov * (Math.PI / 180);
                  let cameraZ = Math.abs(maxDim / Math.tan(fov / 2));
                  cameraZ *= 1.5; // Reduced multiplier for closer view
                  
                  previewCamera.position.set(cameraZ, cameraZ * 0.5, cameraZ);
                  previewCamera.lookAt(0, 0, 0);
                  previewControls.target.set(0, 0, 0);
                  previewControls.update();
                  
                  console.log('Model size:', size);
                  console.log('Model center:', center);
                  console.log('Camera position:', previewCamera.position);
                  console.log('Camera distance:', cameraZ);
                  console.log('Preview scene children:', previewScene.children.length);
                  console.log('✓ Setup complete - model should be visible now');
                  
                  modelKey = prefixVal;
                  currentModelKey = key;
                  showLoadingScreen(false);
                  resolve({ key, url: fileUrl });
                }, (progress) => {
                  // Loading progress
                  if (progress.lengthComputable) {
                    const percentComplete = (progress.loaded / progress.total) * 100;
                    console.log('GLTFLoader progress:', percentComplete.toFixed(2) + '%');
                  }
                }, (e) => {
                  console.error('Error loading GLTF:', e);
                  showLoadingScreen(false);
                  reject(e);
                });
              });
          });
        });
      });
    }

          if (listRes && listRes.Contents && listRes.Contents.length > 0) {
            const pinnedItem = listRes.Contents.find(it => hasPinnedAfterPrefix(it.Key));

        status.style.color = '#f00';

    function applyPinDataToModel(pd) {
      if (!pd || !model) return;
      if (pd.position) {
        model.position.set(pd.position.x, pd.position.y, pd.position.z);
      }
      if (pd.quaternion) {
        model.quaternion.set(pd.quaternion.x, pd.quaternion.y, pd.quaternion.z, pd.quaternion.w);
      }
      if (pd.scale) {
        model.scale.set(pd.scale.x, pd.scale.y, pd.scale.z);
      }
      if (pd.rotation && typeof pd.rotation.y === 'number') {
        model.rotation.y = pd.rotation.y;
      }
    }

    async function compileMindARTarget() {
      if (mindTargetBuffer) return mindTargetBuffer;

      async function ensureMindARCompiler() {
        if (window.MINDAR?.IMAGE?.Compiler) return window.MINDAR.IMAGE.Compiler;
        // Try local ES module import (preferred)
        try {
          const mod = await import(localMindARCore);
          if (mod?.Compiler) {
            window.MINDAR = window.MINDAR || {};
            window.MINDAR.IMAGE = window.MINDAR.IMAGE || {};
            window.MINDAR.IMAGE.Compiler = mod.Compiler;
            return mod.Compiler;
          }
        } catch (e) {
          console.warn('Local MindAR module import failed', e);
        }
        // Try injecting local script (module tag) in case initial load missed
        try {
          await loadExternalScript(localMindARCore);
        } catch (e) {
          console.warn('Local MindAR script load failed', e);
        }
        if (window.MINDAR?.IMAGE?.Compiler) return window.MINDAR.IMAGE.Compiler;
        // CDN fallback as last resort
        try {
          await loadExternalScript(cdnMindARCore);
        } catch (e) {
          console.warn('CDN MindAR script load failed', e);
        }
        if (window.MINDAR?.IMAGE?.Compiler) return window.MINDAR.IMAGE.Compiler;
        throw new Error('MindAR compiler not available');
      }

      const CompilerClass = await ensureMindARCompiler();
      const compiler = new CompilerClass();
      // Ensure the reference image is available as an ImageBitmap
      if (!trackedImageBitmap) {
        const loaded = await loadTrackedImage();
        if (!loaded || !trackedImageBitmap) {
          throw new Error('Failed to load reference image for MindAR compiler');
        }
      }

      // Compile the in-memory bitmap with the runtime compiler API
      await compiler.compileImageTargets([trackedImageBitmap], () => {});
      const compiledData = compiler.exportData();
      mindTargetBuffer = URL.createObjectURL(new Blob([compiledData], { type: 'application/octet-stream' }));
      return mindTargetBuffer;
    }

    async function startMindARSession() {
      await compileMindARTarget();
      mindarThree = new MindARThree({
        container: document.body,
        imageTargetSrc: mindTargetBuffer,
        uiLoading: false,
        uiScanning: false,
      });
      mindarRenderer = mindarThree.renderer;
      mindarScene = mindarThree.scene;
      mindarCamera = mindarThree.camera;
      mindarRenderer.domElement.classList.add('mindar-canvas');
      mindarRenderer.setSize(window.innerWidth, window.innerHeight);
      mindarRenderer.domElement.style.position = 'fixed';
      mindarRenderer.domElement.style.inset = '0';
      mindarRenderer.domElement.style.width = '100vw';
      mindarRenderer.domElement.style.height = '100vh';
      const videoEl = mindarThree.video;
      if (videoEl) {
        videoEl.classList.add('mindar-video');
        videoEl.style.objectFit = 'cover';
        videoEl.style.width = '100vw';
        videoEl.style.height = '100vh';
        videoEl.style.position = 'fixed';
        videoEl.style.inset = '0';
      }
      // Add some light
      const hemi2 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
      mindarScene.add(hemi2);

      mindarAnchor = mindarThree.addAnchor(0);
      mindarAnchor.onTargetFound = async () => {
        anchorReady = true;
        anchorPoseMatrix = mindarAnchor.group.matrixWorld.clone();

        // If we were waiting for a re-scan to save, finalize here
        if (awaitingSaveRescan) {
          await savePinDataWithAnchor();
          return;
        }

        xrImageIndicator.classList.remove('scanning');
        xrImageIndicator.classList.add('found');
        xrImageIndicator.style.display = 'block';
        imageTextEl.textContent = textContent[document.documentElement.lang].anchorLocked;
        anchorScanVisual.style.display = 'none';
        surfaceTextEl.textContent = textContent[document.documentElement.lang].anchorLocked;

        if (currentMode === 'show') {
          anchorLocked = true;
          if (model) {
            if (model.parent !== mindarAnchor.group) {
              if (model.parent) {
                model.parent.remove(model);
              }
              mindarAnchor.group.add(model);
            }
            if (existingPinData && existingPinData.relative) {
              applyPinDataRelativeToAnchor(existingPinData);
            } else if (existingPinData) {
              applyPinDataToModel(existingPinData);
            } else {
              // Safe default pose if no pin data exists
              model.position.set(0, 0, 0);
              model.quaternion.identity();
              model.scale.setScalar(1);
            }
            model.visible = true;
            placed = true;
            xrControls.style.display = 'none';
          }
          return;
        }

        // Edit mode: lock anchor on first detection, then allow placement/adjustment
        if (!anchorLocked) {
          anchorLocked = true;
          if (model) {
            if (model.parent !== mindarAnchor.group) {
              if (model.parent) {
                model.parent.remove(model);
              }
              mindarAnchor.group.add(model);
            }
            if (existingPinData && existingPinData.relative) {
              applyPinDataRelativeToAnchor(existingPinData);
            } else if (!existingPinData) {
              model.position.set(0, 0, 0);
              model.quaternion.identity();
              model.scale.setScalar(1);
            }
            model.visible = true;
            placed = true;
            xrControls.style.display = 'block';
            xrScaleInput.value = model.scale.x;
            xrScaleVal.textContent = `${model.scale.x.toFixed(2)}×`;
          }
        }
      };
      mindarAnchor.onTargetLost = () => {
        // If waiting for a re-scan to save, keep prompting
        if (awaitingSaveRescan) {
          anchorReady = false;
          anchorPoseMatrix = null;
          xrImageIndicator.classList.remove('found');
          xrImageIndicator.classList.add('scanning');
          xrImageIndicator.style.display = 'block';
          imageTextEl.textContent = textContent[document.documentElement.lang].rescanForSave;
          surfaceTextEl.textContent = textContent[document.documentElement.lang].rescanForSave;
          anchorScanVisual.style.display = 'block';
          return;
        }

        // Keep the last locked anchor pose so user doesn't have to rescan
        if (anchorLocked && anchorPoseMatrix) {
          imageTextEl.textContent = textContent[document.documentElement.lang].anchorLocked;
          surfaceTextEl.textContent = textContent[document.documentElement.lang].anchorLocked;
          xrImageIndicator.classList.remove('scanning');
          xrImageIndicator.classList.add('found');
          xrImageIndicator.style.display = 'block';
          return;
        }

        anchorReady = false;
        anchorPoseMatrix = null;
        xrImageIndicator.classList.remove('found');
        xrImageIndicator.classList.add('scanning');
        xrImageIndicator.style.display = 'block';
        imageTextEl.textContent = textContent[document.documentElement.lang].anchorScan;
        surfaceTextEl.textContent = textContent[document.documentElement.lang].anchorScan;
      };

      await mindarThree.start();
      mindarRunning = true;
      mindarRenderer.setAnimationLoop(() => {
        if (anchorReady && mindarAnchor && mindarAnchor.group) {
          anchorPoseMatrix = mindarAnchor.group.matrixWorld.clone();
        }
        mindarRenderer.render(mindarScene, mindarCamera);
      });
    }
    function applyPinDataRelativeToMarker(pd) {
      if (!pd || !pd.relative || !model || !markerPoseMatrix) return;
      const rel = pd.relative;
      const relMatrix = new THREE.Matrix4();
      const relPos = new THREE.Vector3(rel.position.x, rel.position.y, rel.position.z);
      const relQuat = new THREE.Quaternion(rel.quaternion.x, rel.quaternion.y, rel.quaternion.z, rel.quaternion.w);
      const relScale = new THREE.Vector3(rel.scale.x, rel.scale.y, rel.scale.z);
      relMatrix.compose(relPos, relQuat, relScale);
      const worldMatrix = new THREE.Matrix4().copy(markerPoseMatrix).multiply(relMatrix);
      const p = new THREE.Vector3();
      const q = new THREE.Quaternion();
      const s = new THREE.Vector3();
      worldMatrix.decompose(p, q, s);
      model.position.copy(p);
      model.quaternion.copy(q);
      model.scale.copy(s);
      if (rel.rotation && typeof rel.rotation.y === 'number') {
        model.rotation.y = rel.rotation.y;
      }
    }

    function applyPinDataRelativeToAnchor(pd) {
      if (!pd || !pd.relative || !model || !anchorPoseMatrix) return;
      const rel = pd.relative;
      const relMatrix = new THREE.Matrix4();
      const relPos = new THREE.Vector3(rel.position.x, rel.position.y, rel.position.z);
      const relQuat = new THREE.Quaternion(rel.quaternion.x, rel.quaternion.y, rel.quaternion.z, rel.quaternion.w);
      const relScale = new THREE.Vector3(rel.scale.x, rel.scale.y, rel.scale.z);
      relMatrix.compose(relPos, relQuat, relScale);
      const worldMatrix = new THREE.Matrix4().copy(anchorPoseMatrix).multiply(relMatrix);
      const p = new THREE.Vector3();
      const q = new THREE.Quaternion();
      const s = new THREE.Vector3();
      worldMatrix.decompose(p, q, s);
      model.position.copy(p);
      model.quaternion.copy(q);
      model.scale.copy(s);
      if (rel.rotation && typeof rel.rotation.y === 'number') {
        model.rotation.y = rel.rotation.y;
      }
    }

    async function savePinDataWithAnchor() {
      if (savingInProgress) return;
      const currentLang = document.documentElement.lang;

      if (!model || !placed || !modelKey || !currentModelKey) {
        await showAlert(textContent[currentLang].noPinDataToSave);
        awaitingSaveRescan = false;
        return;
      }
      if (!anchorPoseMatrix) {
        await showAlert(textContent[currentLang].anchorSavingGuard);
        awaitingSaveRescan = false;
        return;
      }

      savingInProgress = true;
      const modelMatrix = new THREE.Matrix4().compose(model.position.clone(), model.quaternion.clone(), model.scale.clone());
      const invAnchor = new THREE.Matrix4().copy(anchorPoseMatrix).invert();
      const relMatrix = new THREE.Matrix4().multiplyMatrices(invAnchor, modelMatrix);
      const p = new THREE.Vector3();
      const q = new THREE.Quaternion();
      const s = new THREE.Vector3();
      relMatrix.decompose(p, q, s);
      const pinData = {
        ref: { type: 'anchor', id: 'hit-test-anchor' },
        relative: {
          position: { x: p.x, y: p.y, z: p.z },
          quaternion: { x: q.x, y: q.y, z: q.z, w: q.w },
          scale: { x: s.x, y: s.y, z: s.z },
          rotation: { y: model.rotation.y }
        }
      };

      const pinDataString = JSON.stringify(pinData);
      const encodedPinData = btoa(pinDataString)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');

      const ext = (currentModelKey.split('.').pop() || 'glb').toLowerCase();
      const newKey = `${modelKey}_PINNED_${encodedPinData}.${ext}`;

      try {
        document.getElementById('xr-status').textContent = currentLang === 'ar' ? 'جار الحفظ...' : 'Saving...';

        await s3.copyObject({
          Bucket: bucketName,
          CopySource: `${bucketName}/${currentModelKey}`,
          Key: newKey
        }).promise();

        await s3.deleteObject({
          Bucket: bucketName,
          Key: currentModelKey
        }).promise();

        currentModelKey = newKey;
        hasPinData = true;
        const msg = currentLang === 'ar' ? 'تم الحفظ بنجاح!' : 'Saved successfully!';
        document.getElementById('xr-status').textContent = msg;
        document.getElementById('xr-status').style.color = '#0f0';

        setTimeout(() => {
          if (xrSession) xrSession.end();
        }, 2000);
      } catch (e) {
        console.error('Error saving pin data to AWS:', e);
        const msg = currentLang === 'ar' ? 'فشل الحفظ: ' + e.message : 'Save failed: ' + e.message;
        document.getElementById('xr-status').textContent = msg;
        document.getElementById('xr-status').style.color = '#f00';
      } finally {
        savingInProgress = false;
        awaitingSaveRescan = false;
      }
    }
    function placeModel() {
      if (!model || !anchorPoseMatrix || (!anchorReady && !anchorLocked)) return;
      if (!placed && existingPinData) {
        if (existingPinData.relative) {
          applyPinDataRelativeToAnchor(existingPinData);
        } else {
          applyPinDataToModel(existingPinData);
        }
      }
      model.visible = true;
      placed = true;
      xrSurfaceIndicator.style.display = 'none';
      if (currentMode === 'edit') {
        xrControls.style.display = 'block';
        xrScaleInput.value = model.scale.x;
        xrScaleVal.textContent = `${model.scale.x.toFixed(2)}×`;
      }
    }

    btnShowPin.addEventListener('click', () => startAR('show'));
    btnEditPin.addEventListener('click', () => startAR('edit'));
    xrPinBtn.addEventListener('click', placeModel);

    // XR Scale control
    xrScaleInput.addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      xrScaleVal.textContent = `${s.toFixed(2)}×`;
      if (model && placed) {
        model.scale.setScalar(s);
      }
    });
    
    // XR Rotate control
    xrRotateInput.addEventListener('input', (e) => {
      const deg = parseFloat(e.target.value);
      xrRotateVal.textContent = `${deg}°`;
      if (model && placed) {
        model.rotation.y = (deg * Math.PI) / 180;
      }
    });
    
    // XR Reset button
    xrResetBtn.addEventListener('click', () => {
      if (model) {
        model.visible = false;
        placed = false;
        markerFound = false;
        anchorReady = false;
        anchorLocked = false;
        awaitingSaveRescan = false;
        savingInProgress = false;
        anchorPoseMatrix = null;
        if (mindarAnchor && mindarAnchor.group) {
          mindarAnchor.group.remove(model);
        }
        // Hide controls and re-show surface indicator
        xrControls.style.display = currentMode === 'edit' ? 'none' : 'none';
        xrSurfaceIndicator.style.display = currentMode === 'edit' ? 'block' : 'none';
        anchorScanVisual.style.display = 'block';
        if (trackedImageBitmap) {
          const currentLang = document.documentElement.lang;
          imageTextEl.textContent = textContent[currentLang].anchorScan;
          xrImageIndicator.classList.remove('found');
          xrImageIndicator.classList.add('scanning');
          xrImageIndicator.style.display = 'block';
        }
        reticle.visible = false;
      }
    });
    
    // XR Save to AWS button
    xrSaveAWSBtn.addEventListener('click', async () => {
      const currentLang = document.documentElement.lang;
      if (!model || !placed || !modelKey || !currentModelKey) {
        await showAlert(textContent[currentLang].noPinDataToSave);
        return;
      }
      if (!anchorLocked || !anchorPoseMatrix) {
        await showAlert(textContent[currentLang].anchorRequired);
        return;
      }

      awaitingSaveRescan = true;
      anchorReady = false;
      document.getElementById('xr-status').textContent = textContent[currentLang].rescanForSave;
      document.getElementById('xr-status').style.color = '#ffc107';
      xrImageIndicator.classList.remove('found');
      xrImageIndicator.classList.add('scanning');
      xrImageIndicator.style.display = 'block';
      imageTextEl.textContent = textContent[currentLang].rescanForSave;
      surfaceTextEl.textContent = textContent[currentLang].rescanForSave;
      anchorScanVisual.style.display = 'block';
      anchorPoseMatrix = null;
      // The next image detection will capture a fresh anchor pose and trigger saving
    });

    window.addEventListener('resize', () => {
      // Update preview renderer
      previewRenderer.setSize(window.innerWidth, window.innerHeight);
      previewCamera.aspect = window.innerWidth / window.innerHeight;
      previewCamera.updateProjectionMatrix();
      
      // Update preview/XR renderer (preview only; MindAR handles its own)
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      if (mindarRenderer) {
        mindarRenderer.setSize(window.innerWidth, window.innerHeight);
      }
      if (mindarThree && mindarThree.video) {
        mindarThree.video.style.width = '100vw';
        mindarThree.video.style.height = '100vh';
        mindarThree.video.style.position = 'fixed';
        mindarThree.video.style.inset = '0';
      }
    });

    // Initialize Arabic as default and auto-load model
    setLang('ar');
    autoLoadModel();
  </script>
</body>
</html>
