<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic Web AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >

    <!-- Marker -->
    <a-marker preset="hiro">
      <a-entity
        id="ar-model"
        scale="0.5 0.5 0.5"
        rotation="0 180 0"
      ></a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- YOUR LOADING LOGIC -->
  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const modelEntity = document.getElementById('ar-model');

      // Prefer sessionStorage set by index.html
      let modelUrl = sessionStorage.getItem('currentModelUrl');

      // Fallback: query param
      if (!modelUrl) {
        const modelKey = getQueryParam('model');

        if (
          modelKey &&
          window.AWS_CONFIG &&
          AWS_CONFIG.bucketName &&
          AWS_CONFIG.region
        ) {
          modelUrl = `https://${AWS_CONFIG.bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${modelKey}`;
        } else if (modelKey) {
          modelUrl = modelKey;
        }
      }

      if (modelUrl) {
        modelEntity.setAttribute('gltf-model', modelUrl);
      } else {
        console.warn(
          'No model URL found. Open AR from index.html first.'
        );
      }
    });
  </script>

</body>
</html>
