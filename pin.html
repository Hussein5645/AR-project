<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR.js GLB Model</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="colorManagement: true; physicallyCorrectLights"
  >

    <!-- Camera -->
    <a-entity camera></a-entity>

    <!-- Marker (Hiro marker) -->
    <a-marker preset="hiro">

      <!-- GLB Model -->
      <a-entity
        id="ar-model"
        gltf-model=""
        scale="0.5 0.5 0.5"
        position="0 0 0"
        rotation="0 180 0">
      </a-entity>

    </a-marker>

  </a-scene>
  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const modelEntity = document.getElementById('ar-model');

      // Prefer sessionStorage set by index.html
      let modelUrl = sessionStorage.getItem('currentModelUrl');

      // Fallback: if a `model` query param exists, try to build an S3 URL
      if (!modelUrl) {
        const modelKey = getQueryParam('model');
        if (modelKey && window.AWS_CONFIG && AWS_CONFIG.bucketName && AWS_CONFIG.region) {
          modelUrl = `https://${AWS_CONFIG.bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${modelKey}`;
        } else if (modelKey) {
          // If only the key is present, use it directly (useful if key is a full path)
          modelUrl = modelKey;
        }
      }

      if (modelUrl) {
        // A-Frame accepts either a plain URL or url(...) syntax
        modelEntity.setAttribute('gltf-model', modelUrl);
      } else {
        console.warn('No model URL found in sessionStorage or query param. Open the model from index.html first.');
      }
    });
  </script>
</body>
</html>
