<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>Babylon.js WebXR Standalone: Dummy3</title>

        <style>
            html, body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
            #renderCanvas {
                width: 100%;
                height: 100%;
                touch-action: none;
                outline: none;
            }
        </style>

        <script src="https://cdn.babylonjs.com/babylon.js"></script>
        
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
        
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    </head>

   <body>
    <canvas id="renderCanvas"></canvas>
    
    <script>
        // === INITIALIZATION PHASE ===
        // Get the canvas element from the DOM
        const canvas = document.getElementById("renderCanvas");

        // Initialize the Babylon 3D engine
        // 'true' enables antialiasing for smoother edges in VR 
        const engine = new BABYLON.Engine(canvas, true);

        // === SCENE CREATION LOGIC ===
        // This function encapsulates the entire scene setup.
        // It is async to handle the Promise-based Asset Loading and XR setup.
        const createScene = async function () {
            
            // 1. Create the Scene Object
            const scene = new BABYLON.Scene(engine);

            // 2. Camera Setup (Non-XR Fallback)
            // This ArcRotateCamera allows the user to view the model on a standard monitor.
            // Parameters: Name, Alpha (rotation), Beta (rotation), Radius, Target.
            const camera = new BABYLON.ArcRotateCamera("camera1", Math.PI / 2, Math.PI / 2.5, 5, new BABYLON.Vector3(0, 1, 0), scene);
            // Attach inputs (mouse/touch) to the canvas
            camera.attachControl(canvas, true);
            // Set the wheel precision for smoother zooming
            camera.wheelPrecision = 50;

            // 3. Lighting Setup
            // HemisphericLight simulates ambient sky light, ensuring the model is lit from all sides.
            const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;

            // 4. Asset Loading 
            // We use the absolute URL to the playground asset to avoid local path errors.
            const dummy3URL = "https://playground.babylonjs.com/scenes/dummy3.babylon";
            
            console.log("Status: Starting Asset Load from " + dummy3URL);

            try {
                // ImportMeshAsync is the modern, Promise-based loader.
                // It handles the network request and parsing.
                const result = await BABYLON.SceneLoader.ImportMeshAsync("", dummy3URL, "", scene);
                
                console.log("Status: Asset Loaded Successfully");
                
                // 5. Mesh Configuration
                const dummyMesh = result.meshes;
                // Ensure the mesh is positioned at the center
                dummyMesh.position = new BABYLON.Vector3(0, 0, 0);
                
                // 6. Animation Handling [7, 14]
                // The loaded asset contains skeletons and animation ranges.
                if (result.skeletons.length > 0) {
                    const skeleton = result.skeletons;
                    // Play the animation (frames 0 to 100, looped)
                    scene.beginAnimation(skeleton, 0, 100, true, 1.0);
                }

                // 7. Environment Setup for WebXR [15]
                // XR Teleportation requires a ground mesh.
                // We use the default environment helper to create a ground and skybox.
                const env = scene.createDefaultEnvironment({
                    createSkybox: true,
                    skyboxSize: 150,
                    skyboxColor: new BABYLON.Color3(0.1, 0.1, 0.1),
                    createGround: true,
                    groundSize: 15,
                    groundColor: new BABYLON.Color3(0.2, 0.2, 0.2),
                    enableGroundShadow: true,
                });

                // 8. WebXR Initialization [12, 16]
                // This creates the XR experience helper.
                // It automatically adds the UI button to enter VR/AR.
                // We pass the ground mesh to enable the teleportation feature.
                const xr = await scene.createDefaultXRExperienceAsync({
                    floorMeshes: [env.ground]
                });
                
                console.log("Status: WebXR Initialized");

            } catch (error) {
                console.error("Error during scene creation:", error);
            }

            return scene;
        };

        // === EXECUTION PHASE ===
        // Call the createScene function
        createScene().then((scene) => {
            // Register the render loop to repeatedly render the scene
            engine.runRenderLoop(function () {
                if (scene) {
                    scene.render();
                }
            });
        });

        // === RESPONSIVE DESIGN ===
        // Watch for browser resize events to adjust the WebGL canvas
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
   </body>
</html>
