<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Pinned AR Model</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
  <script src="aws-config.js"></script>
  <style>
    body[lang="ar"] { direction: rtl; }
    body[lang="en"] { direction: ltr; }
    body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: #fff; overflow: hidden; }
    #lang-toggle { position: fixed; top: 10px; right: 10px; z-index: 11; padding: 8px 12px; border-radius: 6px; background: #444; color: #fff; cursor: pointer; }
    #loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-size: 1.2em; z-index: 20; transition: opacity 0.5s ease; text-align: center; padding: 20px; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #error-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #121212; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 20; text-align: center; padding: 20px; }
    #error-screen h2 { color: #ff6b6b; margin-bottom: 20px; }
    #error-screen button { padding: 12px 24px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    #error-screen button:hover { background: #0056b3; }
    canvas.xr { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #ar-info { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 15px 20px; border-radius: 8px; z-index: 25; text-align: center; color: #bbb; font-size: 14px; }
  </style>
</head>
<body lang="ar">
  <button id="lang-toggle">English</button>
  
  <div id="loading-screen">
    <div id="loading-text">جار التحميل...</div>
  </div>

  <div id="error-screen">
    <h2 id="error-title">لا توجد بيانات تثبيت</h2>
    <p id="error-message">هذا النموذج لا يحتوي على بيانات تثبيت محفوظة.</p>
    <button id="redirect-btn" onclick="window.location.href='index.html'">عودة إلى الصفحة الرئيسية</button>
  </div>

  <div id="ar-info" style="display: none;">
    <p id="info-text">اضغط لبدء تجربة AR</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const textContent = {
      ar: {
        loading: 'جار التحميل...',
        errorTitle: 'لا توجد بيانات تثبيت',
        errorMessage: 'هذا النموذج لا يحتوي على بيانات تثبيت محفوظة.',
        redirectBtn: 'عودة إلى الصفحة الرئيسية',
        infoText: 'اضغط لبدء تجربة AR',
        toggleLang: 'English'
      },
      en: {
        loading: 'Loading...',
        errorTitle: 'No Pin Data Found',
        errorMessage: 'This model does not have saved pin data.',
        redirectBtn: 'Back to Home',
        infoText: 'Tap to start AR experience',
        toggleLang: 'Arabic'
      }
    };

    function setLang(lang) {
      document.documentElement.lang = lang;
      document.body.setAttribute('lang', lang);
      const t = textContent[lang];
      document.getElementById('loading-text').textContent = t.loading;
      document.getElementById('error-title').textContent = t.errorTitle;
      document.getElementById('error-message').textContent = t.errorMessage;
      document.getElementById('redirect-btn').textContent = t.redirectBtn;
      document.getElementById('info-text').textContent = t.infoText;
      document.getElementById('lang-toggle').textContent = t.toggleLang;
    }

    const langToggle = document.getElementById('lang-toggle');
    langToggle.addEventListener('click', () => {
      const newLang = (document.documentElement.lang === 'ar') ? 'en' : 'ar';
      setLang(newLang);
    });

    const s3 = new AWS.S3();
    const bucketName = AWS_CONFIG.bucketName;
    const loadingScreen = document.getElementById('loading-screen');
    const errorScreen = document.getElementById('error-screen');
    const arInfo = document.getElementById('ar-info');

    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function showError() {
      loadingScreen.classList.add('hidden');
      errorScreen.style.display = 'flex';
    }

    function showLoading(show) {
      loadingScreen.classList.toggle('hidden', !show);
    }

    // Three.js setup
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.xr.enabled = true;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.classList.add('xr');
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
    scene.add(hemi);

    const loader = new GLTFLoader();
    let model = null;
    let pinData = null;

    async function loadModelWithPin(prefix) {
      try {
        // List objects with prefix
        const listResult = await s3.listObjectsV2({ 
          Bucket: bucketName, 
          Prefix: prefix 
        }).promise();

        if (!listResult.Contents || listResult.Contents.length === 0) {
          throw new Error('No model found');
        }

        // Find the file with pin data (contains underscore after prefix)
        let modelFile = null;
        let pinDataEncoded = null;

        for (const item of listResult.Contents) {
          const key = item.Key;
          if (key.startsWith(prefix)) {
            const parts = key.split('_');
            if (parts.length > 1) {
              // Has pin data
              const fileNameWithExt = parts[1];
              const dotIndex = fileNameWithExt.lastIndexOf('.');
              if (dotIndex > 0) {
                pinDataEncoded = fileNameWithExt.substring(0, dotIndex);
                modelFile = key;
                break;
              }
            }
          }
        }

        if (!modelFile) {
          // No pin data found
          showError();
          return;
        }

        // Decode pin data
        try {
          const pinDataString = atob(pinDataEncoded);
          pinData = JSON.parse(pinDataString);
        } catch (e) {
          console.error('Failed to decode pin data:', e);
          showError();
          return;
        }

        // Load the model
        const fileUrl = `https://${bucketName}.s3.${AWS_CONFIG.region}.amazonaws.com/${modelFile}`;
        
        loader.load(fileUrl, (gltf) => {
          model = gltf.scene;
          
          // Apply pin data
          if (pinData.position) {
            model.position.set(pinData.position.x, pinData.position.y, pinData.position.z);
          }
          if (pinData.quaternion) {
            model.quaternion.set(pinData.quaternion.x, pinData.quaternion.y, pinData.quaternion.z, pinData.quaternion.w);
          }
          if (pinData.scale) {
            model.scale.set(pinData.scale.x, pinData.scale.y, pinData.scale.z);
          }
          
          model.visible = true;
          scene.add(model);
          
          showLoading(false);
          arInfo.style.display = 'block';
          
          // Start AR session automatically on mobile
          const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          if (isMobile) {
            setTimeout(() => startAR(), 1000);
          }
        }, undefined, (e) => {
          console.error('Failed to load model:', e);
          showError();
        });

      } catch (e) {
        console.error('Error:', e);
        showError();
      }
    }

    async function startAR() {
      if (!navigator.xr) {
        alert('WebXR غير مدعوم على هذا الجهاز/المتصفح.');
        return;
      }
      
      if (!model) {
        alert('النموذج غير محمل بعد.');
        return;
      }

      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['anchors']
        });
        
        renderer.xr.setSession(session);
        const refSpace = await session.requestReferenceSpace('local-floor');
        
        session.addEventListener('end', () => {
          console.log('AR session ended');
        });

        renderer.setAnimationLoop((time, frame) => {
          renderer.render(scene, camera);
        });
        
        arInfo.style.display = 'none';
      } catch (e) {
        console.error('Failed to start AR:', e);
        alert('فشل بدء جلسة AR: ' + e.message);
      }
    }

    // Click handler for starting AR
    arInfo.addEventListener('click', startAR);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // Load model on page load
    const modelKey = getQueryParam('model');
    if (modelKey && modelKey.length === 10) {
      loadModelWithPin(modelKey);
    } else {
      showError();
    }

    // Initialize Arabic as default
    setLang('ar');
  </script>
</body>
</html>
